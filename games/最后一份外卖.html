"use strict";
/* ============ 工具 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function toast(msg,ms=2200){const d=document.createElement("div");d.className="toast";d.textContent=msg;$("toasts").appendChild(d);setTimeout(()=>{d.style.opacity="0";d.style.transition="opacity .4s";setTimeout(()=>d.remove(),400)},ms);}
/* ============ 音效 ============ */
let AU={ctx:null,muted:false};
try{AU.muted=localStorage.getItem("waimai_mute")==="1";}catch(e){}
function beep(f,d,type,v){
d=d||0.08;type=type||"sine";v=v||0.12;
if(AU.muted)return;
try{
AU.ctx=AU.ctx||new (window.AudioContext||window.webkitAudioContext)();
const o=AU.ctx.createOscillator(),g=AU.ctx.createGain();
o.type=type;o.frequency.value=f;g.gain.value=v;
o.connect(g);g.connect(AU.ctx.destination);o.start();
g.gain.exponentialRampToValueAtTime(0.001,AU.ctx.currentTime+d);o.stop(AU.ctx.currentTime+d);
}catch(e){}
}
const sfx={
click:()=>beep(620),
go:()=>{beep(300,0.08,"triangle");setTimeout(()=>beep(520,0.08,"triangle"),70);},
event:()=>{beep(440,0.12);setTimeout(()=>beep(330,0.15),120);},
good:()=>{beep(660,0.1);setTimeout(()=>beep(880,0.14),100);},
bad:()=>beep(180,0.25,"sawtooth",0.08),
coin:()=>{beep(990,0.07,"square",0.06);setTimeout(()=>beep(1320,0.1,"square",0.06),70);},
win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.18),i*140));}
};
function refreshMuteBtns(){const t=AU.muted?tx("muteOff"):tx("muteOn");if($("btnMute"))$("btnMute").textContent=t;if($("btnMute2"))$("btnMute2").textContent=AU.muted?"🔇":"🔔";}
function toggleMute(){AU.muted=!AU.muted;try{localStorage.setItem("waimai_mute",AU.muted?"1":"0");}catch(e){}refreshMuteBtns();if(!AU.muted)sfx.click();}
/* ============ 存档 ============ */
const DB={
get(k,d){try{const v=localStorage.getItem("waimai_"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
set(k,v){try{localStorage.setItem("waimai_"+k,JSON.stringify(v));}catch(e){}}
};
let fund=DB.get("fund",0);
let up=DB.get("up",{range:0,speed:0,load:0});
let rep=DB.get("rep",{});
let ach=DB.get("ach",{});
let best=DB.get("best",-1);
let diaryTotal=DB.get("diaryTotal",0);
/* ============ I18N ============ */
let LANG='zh';
try{const _sv=DB.get("wm_lang",null);LANG=_sv||(((navigator.language||"zh").toLowerCase().indexOf("zh")===0)?"zh":"en");}catch(e){LANG="zh";}

function tx(k){const v=STR[k];return LANG==="en"?v[1]:v[0];}
const DISTRICTS_EN=["Binjiang","Xiaoshan","Shangcheng","Xihu","Gongshu","Wulin","Yuhang"];
function distName(d){const i=DISTRICTS.indexOf(d);return (LANG==="en"&&i>=0)?DISTRICTS_EN[i]:d;}
function nodeName(n){return (LANG==="en"&&n.en)?n.en:n.n;}
function mName(){const m=MERCHANTS.find(function(x){return x.node===G.merchantNode;});return (LANG==="en"&&m.en_name)?m.en_name:m.name;}
function mFood(){const m=MERCHANTS.find(function(x){return x.node===G.merchantNode;});return (LANG==="en"&&m.en_food)?m.en_food:m.food;}
function evT(ev,f){const e=EVENTS_EN[ev.id];return (LANG==="en"&&e&&e[f])?e[f]:ev[f];}
function refreshDest(){
if(!G)return;
$("orderTag").textContent=G.orderType==="big"?tx("oBig"):G.orderType==="near"?tx("oNear"):"";
if(!G.pickedUp)$("destName").textContent=tx("dPickup")+mName();
else if(!G.midDone)$("destName").textContent=tx("dSide")+nodeName(NODES[G.midNode])+tx("dSideTag")+nodeName(NODES[G.destNode]);
else $("destName").textContent=tx("dSide")+nodeName(NODES[G.destNode])+tx("dHome");
}

/* ============ 对局状态 ============ */
/* 顺路单中转点：总路程（起点→商家→中转→终点）落在 9~11 段，单局有体量感又不拖沓 */
function pickMid(mNode,dNode){
const h0=pathHops(0,mNode);
let bm=dNode,bd=1e9;const cands=[];
for(let i=0;i<NODES.length;i++){if(i!==mNode&&i!==dNode&&i!==0)cands.push(i);}
for(let t=0;t<80;t++){const m=pick(cands);const tot=h0+pathHops(mNode,m)+pathHops(m,dNode);
if(tot>=9&&tot<=11)return m;
const d=Math.abs(tot-10);if(d<bd){bd=d;bm=m;}}
return bm;
}
let G=null;
function newRun(orderType){
const merchant=pick(MERCHANTS);
const nearOrder=orderType==="near";
G={
node:0,merchantNode:merchant.node,merchantName:merchant.name,food:merchant.food,
pickedUp:false,destNode:nearOrder?14:17,
elapsed:0,deadline:55-(orderType==="big"?10:0),
battMax:100+40*up.range,batt:100+40*up.range,
stam:100,money:0,shan:0,
moves:0,steps:0,closed:new Set(),flooded:new Set(),
usedEvents:new Set(),diary:[],accel:false,accelLeft:0,blindLeft:0,
noraincoat:false,checked:false,orderType:orderType,
orderBonus:orderType==="big"?800:orderType==="near"?300:0
};
G.midNode=pickMid(merchant.node,G.destNode);G.midDone=false;
/* 限时按路程浮动：路长了，限时也要给够——紧张感留给事件抉择，而不是赶路本身 */
const totalHops=pathHops(0,merchant.node)+pathHops(merchant.node,G.midNode)+pathHops(G.midNode,G.destNode);
G.deadline=Math.round(40+2.5*totalHops-(orderType==="big"?10:0));
showScreen("gameScreen");
refreshDest();
toast(tx("tStart")+tx("tLimitL")+G.deadline+tx("tLimitR"));
sfx.go();updateHUD();drawMap();updateRoute();
}
/* ============ 时间/数值 ============ */
function fmtClock(){const m=23*60+Math.floor(G.elapsed);const h=Math.floor(m/60)%24;const mm=m%60;return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm;}
function moveTime(flooded){
let t=4-0.5*up.speed;
if(G.accel)t=2.5;
if(flooded)t+=3;
if(G.batt<=0)t*=2;
if(G.stam<30)t+=1;
return Math.max(1.5,t);
}
function moveBatt(flooded){
if(G.batt<=0)return 0;
return Math.round((6+(G.accel?5:0)+(flooded?4:0))*1.5);
}
function addShan(v){G.shan=clamp(G.shan+v,-20,100);}
function addRep(v){const d=NODES[G.node].d;rep[d]=(rep[d]||0)+v;DB.set("rep",rep);}
function addDiary(t){t=t.replace("{node}",nodeName(NODES[G.node]));G.diary.push(""+t);}
/* ============ 寻路 ============ */
function edgeKey(a,b){return a<b?a+"-"+b:b+"-"+a;}
function bfsPath(from,to){
if(from===to)return [from];
const prev={};prev[from]=-1;const q=[from];
while(q.length){
const c=q.shift();
const nbs=ADJ[c];
for(let i=0;i<nbs.length;i++){
const nb=nbs[i];
if(G.closed.has(edgeKey(c,nb))||prev[nb]!==undefined)continue;
prev[nb]=c;
if(nb===to){const p=[to];let x=to;while(prev[x]!==-1){x=prev[x];p.unshift(x);}return p;}
q.push(nb);
}
}
return null;
}
function pathHops(from,to){const p=bfsPath(from,to);return p?p.length-1:99;}
function ensureConnected(){
return bfsPath(G.node,G.merchantNode)!==null&&bfsPath(G.node,G.destNode)!==null&&bfsPath(G.node,G.midNode)!==null;
}
/* ============ 移动 ============ */
let moving=false;
function tryMove(to){
if(!G||moving||isModalOpen())return;
if(ADJ[G.node].indexOf(to)<0){toast(tx("tNoReach"));return;}
if(G.closed.has(edgeKey(G.node,to))){toast(tx("tRoadClosed"));sfx.bad();return;}
moving=true;sfx.go();
const from=G.node;const flooded=G.flooded.has(edgeKey(from,to));
animateMove(from,to,function(){
G.node=to;G.moves++;G.steps++;
const t=moveTime(flooded);const b=moveBatt(flooded);
G.elapsed+=t;G.batt=Math.max(0,G.batt-b);
G.stam=clamp(G.stam-(2+(G.noraincoat?1:0)+(flooded?3:0)+(G.accel?3:0)),0,100);
if(G.accelLeft>0){G.accelLeft--;if(G.accelLeft===0){G.accel=false;toast(tx("tBoostEnd"));}}
if(G.blindLeft>0)G.blindLeft--;
moving=false;
if(G.stam<=0){G.stam=40;G.elapsed+=6;toast(tx("tExhaust"));addDiary(tx("dExhaust"));}
if(G.steps%2===0)rollHazard();
updateHUD();drawMap();updateRoute();
onArrive();
});
}
function onArrive(){
if(G.node===G.merchantNode&&!G.pickedUp){pickupEvent();return;}
if(G.pickedUp&&!G.midDone&&G.node===G.midNode){midEvent();return;}
if(G.node===G.destNode&&G.pickedUp&&G.midDone){deliverEvent();return;}
stopServices(function(){afterStop();});
}
function stopServices(next){
const n=NODES[G.node];
if(n.charge&&G.batt<G.battMax){
const tgt=G.pickedUp?(G.midDone?G.destNode:G.midNode):G.merchantNode;
const nh=pathHops(G.node,tgt);const needB=Math.round(nh*9);
openModal(tx("mChargeT"),"<div class='body'>"+tx("mChargeB1")+"<b style='color:#ffcf7a'>"+tx("mChargeB2")+"</b>"+tx("mChargeB3")+nodeName(NODES[tgt])+tx("mChargeB4")+needB+tx("mChargeB5")+tx("mChargeB6")+"<b>"+Math.round(G.batt)+"</b>"+tx("mChargeB7")+"</div>",
[{label:tx("optSwap"),cost:tx("optSwapC"),fn:function(){G.batt=Math.min(G.battMax,G.batt+40);G.elapsed+=3;updateHUD();drawMap();updateRoute();next();}},
{label:tx("optSkip"),cost:"",fn:next}]);
return;
}
if(n.shop){
openModal(tx("mShopT"),"<div class='body'>"+tx("mShopB")+"</div>",
[{label:tx("optWarm"),cost:tx("optWarmC"),fn:function(){G.stam=clamp(G.stam+25,0,100);G.elapsed+=3;sfx.good();updateHUD();next();}},
{label:tx("optSkip"),cost:"",fn:next}]);
return;
}
next();
}
function afterStop(noEvent){
if(!noEvent&&Math.random()<0.7){
let avail=EVENTS.filter(function(e){return!G.usedEvents.has(e.id);});
if(G.checked)avail=avail.filter(function(e){return e.id!=="spill"||Math.random()<0.5;});
if(avail.length){openEvent(pick(avail));return;}
}
updateHUD();drawMap();updateRoute();
}
function pickupEvent(){
openModal("🍱 "+mName(),"<div class='body'>"+tx("mPickupB1")+mFood()+tx("mPickupB2")+"</div>",
[{label:tx("optCheck"),cost:tx("optCheckC"),fn:function(){G.elapsed+=2;G.checked=true;doPickup();}},
{label:tx("optGrab"),cost:"",fn:function(){doPickup();}}]);
}
function doPickup(){
G.pickedUp=true;
refreshDest();
toast(tx("tPickup")+nodeName(NODES[G.midNode]));sfx.good();
updateHUD();drawMap();updateRoute();
stopServices(function(){afterStop();});
}
function midEvent(){
G.midDone=true;G.money+=100;addShan(6);
addDiary(tx("dMid"));
refreshDest();
openModal(tx("mMidT"),"<div class='body'>"+tx("mMidB")+"</div>",
[{label:tx("optMid"),cost:tx("optMidC"),fn:function(){sfx.good();updateHUD();drawMap();updateRoute();stopServices(function(){afterStop();});}}]);
}
function deliverEvent(){
const door=EVENTS.find(function(e){return e.id==="doorstep";});
if(!G.usedEvents.has("doorstep")){openEvent(door);return;}
settle();
}
/* ============ 灾害 ============ */
function rollHazard(){
if(Math.random()>0.55)return;
const cands=EDGES.filter(function(e){
const k=edgeKey(e[0],e[1]);
return!G.closed.has(k)&&!G.flooded.has(k);
});
if(!cands.length)return;
const e=pick(cands);const k=edgeKey(e[0],e[1]);
if(Math.random()<0.4){
G.closed.add(k);
if(!ensureConnected()){G.closed.delete(k);return;}
toast(tx("tTree"));sfx.bad();
}else{
G.flooded.add(k);
toast(tx("tFlood"));sfx.bad();
}
}
/* ============ 事件引擎 ============ */
function openEvent(ev){
G.usedEvents.add(ev.id);sfx.event();
const ee=EVENTS_EN[ev.id];
const opts=ev.opts.map(function(o,oi){
const eo=ee&&ee.opts[oi];
return {label:tr(o.label,eo&&eo.label),cost:tr(o.cost,eo&&eo.cost),fn:function(){
applyFx(o.fx||{},ev,{diary:tr(o.diary,eo&&eo.diary)});
updateHUD();drawMap();updateRoute();
if(G.node===G.destNode&&G.pickedUp&&ev.id==="doorstep"){settle();}
else{afterStop(true);}
}};
});
openModal("❗ "+evT(ev,"title"),"<div class='body'>"+evT(ev,"text")+"</div>",opts);
}
function applyFx(fx,ev,opt){
if(fx.gamble){
const win=Math.random()>=fx.gamble.p;
const sub=win?fx.gamble.win:fx.gamble.lose;
toast(win?tx("tGambleWin"):tx("tGambleLose"));if(win){sfx.good();}else{sfx.bad();}
applyFx(sub,ev,opt);return;
}
if(fx.time)G.elapsed+=fx.time;
if(fx.batt)G.batt=clamp(G.batt+fx.batt,0,G.battMax);
if(fx.stam)G.stam=clamp(G.stam+fx.stam,0,100);
if(fx.money){G.money+=fx.money;if(fx.money>0)sfx.coin();}
if(fx.shan){addShan(fx.shan);if(fx.shan>0)sfx.good();}
if(fx.rep)addRep(fx.rep);
if(fx.noraincoat){G.noraincoat=true;toast(tx("tRaincoat"));}
if(fx.accel3){G.accel=true;G.accelLeft=3;toast(tx("tAccel3"));}
if(fx.blind3){G.blindLeft=3;toast(tx("tBlind3"));}
if(opt&&opt.diary)addDiary(opt.diary);
if(fx.shan>0&&Math.random()<0.3)addDiary(pick([tx("dPool1"),tx("dPool2"),tx("dPool3")]));
}

/* ============ HUD & 路线 ============ */
function updateHUD(){
if(!G)return;
const rem=Math.round(G.deadline-G.elapsed);
$("clock").textContent=fmtClock()+(rem>=0?tx("hudLeft1")+rem+tx("hudLeft2"):tx("hudLate")+(-rem)+tx("hudLate2"));
$("clock").style.color=rem<0?"#ff6b6b":(rem<=10?"#ffb347":"#ffd97a");
$("hudMoney").textContent=G.money;
$("hudShan").textContent=G.shan;
$("hudBatt").style.width=(100*G.batt/G.battMax)+"%";
$("hudBattN").textContent=Math.round(G.batt);
$("hudStam").style.width=G.stam+"%";
$("hudStamN").textContent=Math.round(G.stam);
}
function updateRoute(){
if(!G)return;
const target=G.pickedUp?(G.midDone?G.destNode:G.midNode):G.merchantNode;
if(G.blindLeft>0){$("estLine").textContent=tx("rBlind")+G.blindLeft+tx("rBlind2");return;}
const hops=pathHops(G.node,target);
if(hops>=99){$("estLine").textContent=tx("rBlocked");return;}
const t=Math.round(hops*(4-0.5*up.speed));const b=Math.round(hops*9);
const rem=Math.round(G.deadline-G.elapsed);
const cmp=rem>=0?(tx("rRem")+rem+tx("rRem2")+(t<=rem?" ✅":tx("rShort"))):(tx("rLate")+(-rem)+tx("rLate2"));
$("estLine").textContent=tx("rEst1")+t+tx("rEst2")+b+tx("rEst3")+hops+tx("rEst4")+cmp+(G.accel?tx("rBoost"):"");
}
/* ============ 地图渲染 ============ */
const cv=$("map");const ctx2d=cv.getContext("2d");
const VW=100;const VH=168;let SC=1;
const rainDrops=[];for(let i=0;i<70;i++)rainDrops.push({x:rnd(0,100),y:rnd(0,168),v:rnd(40,80)});
function resizeMap(){
const w=$("mapWrap").clientWidth;const h=$("mapWrap").clientHeight;
if(!w||!h)return;
const dpr=Math.min(2,window.devicePixelRatio||1);
cv.width=w*dpr;cv.height=h*dpr;
SC=Math.min(cv.width/VW,cv.height/VH);
}
window.addEventListener("resize",resizeMap);
let animPos=null;
function animateMove(a,b,cb){
const A=NODES[a];const B=NODES[b];
animPos={x0:A.x,y0:A.y,x1:B.x,y1:B.y,t:0};
const step=function(){animPos.t+=0.06;if(animPos.t>=1){animPos=null;cb();}else{requestAnimationFrame(step);}};
requestAnimationFrame(step);
}
function lerp(a,b,t){return a+(b-a)*t;}
function drawMap(){
const W=cv.width;const H=cv.height;
if(!W||!H){requestAnimationFrame(drawMap);return;}
ctx2d.setTransform(1,0,0,1,0,0);
ctx2d.fillStyle="#0a0f1e";ctx2d.fillRect(0,0,W,H);
const ox=(W-VW*SC)/2;const oy=(H-VH*SC)/2;
ctx2d.translate(ox,oy);ctx2d.scale(SC,SC);
const T=performance.now()/1000;
ctx2d.strokeStyle="rgba(140,170,220,.28)";ctx2d.lineWidth=0.35;
for(let i=0;i<rainDrops.length;i++){const d=rainDrops[i];ctx2d.beginPath();ctx2d.moveTo(d.x,d.y);ctx2d.lineTo(d.x-0.6,d.y+2.4);ctx2d.stroke();}
if(!G){requestAnimationFrame(drawMap);return;}
const target=G.pickedUp?(G.midDone?G.destNode:G.midNode):G.merchantNode;
const path=bfsPath(G.node,target);
if(path&&path.length>1){
ctx2d.strokeStyle="rgba(255,170,40,.5)";ctx2d.lineWidth=1.1;ctx2d.setLineDash([2.5,2]);
ctx2d.beginPath();
for(let i=0;i<path.length;i++){const n=NODES[path[i]];if(i)ctx2d.lineTo(n.x,n.y);else ctx2d.moveTo(n.x,n.y);}
ctx2d.stroke();ctx2d.setLineDash([]);
}
for(let i=0;i<EDGES.length;i++){
const a=EDGES[i][0];const b=EDGES[i][1];
const A=NODES[a];const B=NODES[b];const k=edgeKey(a,b);
const closed=G.closed.has(k);const flood=G.flooded.has(k);
ctx2d.strokeStyle=closed?"rgba(120,40,40,.9)":flood?"rgba(60,140,255,.75)":"rgba(70,95,140,.4)";
ctx2d.lineWidth=flood?1.6:0.8;
ctx2d.beginPath();ctx2d.moveTo(A.x,A.y);ctx2d.lineTo(B.x,B.y);ctx2d.stroke();
const mx=(A.x+B.x)/2;const my=(A.y+B.y)/2;
if(closed){ctx2d.fillStyle="#ff6b6b";ctx2d.font="bold 5px sans-serif";ctx2d.textAlign="center";ctx2d.fillText("✕",mx,my+1.8);}
if(flood){ctx2d.fillStyle="#5aa9ff";ctx2d.font="5px sans-serif";ctx2d.textAlign="center";ctx2d.fillText("≋",mx,my+1.8);}
}
for(let i=0;i<NODES.length;i++){
const n=NODES[i];
const isP=G.node===n.id;const isT=target===n.id;const isM=n.id===G.merchantNode&&!G.pickedUp;
const adj=ADJ[G.node].indexOf(n.id)>=0;
ctx2d.beginPath();ctx2d.arc(n.x,n.y,4.4,0,7);
ctx2d.fillStyle=isP?"#ffaa28":isT?"#ff5b5b":isM?"#ffd97a":"#1b2745";
ctx2d.fill();
if(adj&&!isP){ctx2d.strokeStyle="#37d67a";ctx2d.lineWidth=1.2;ctx2d.beginPath();ctx2d.arc(n.x,n.y,6.4+Math.sin(T*4),0,7);ctx2d.stroke();}
if(isT){ctx2d.strokeStyle="#ff5b5b";ctx2d.lineWidth=1.4;ctx2d.beginPath();ctx2d.arc(n.x,n.y,7+Math.sin(T*5)*1.2,0,7);ctx2d.stroke();}
ctx2d.fillStyle="#0a0f1e";ctx2d.font="bold 4.6px sans-serif";ctx2d.textAlign="center";
let icon="";
if(n.charge)icon="🔋";else if(n.shop)icon="🏪";else if(isM)icon="🍱";else if(n.id===G.midNode&&G.pickedUp&&!G.midDone)icon="📦";else if(n.id===G.destNode&&G.pickedUp)icon="🏠";
if(icon)ctx2d.fillText(icon,n.x,n.y+1.7);
ctx2d.fillStyle=isP?"#ffd97a":"#8fa3c8";ctx2d.font="3.1px sans-serif";
ctx2d.fillText(nodeName(n),n.x,n.y+9.5);
}
let px=NODES[G.node].x;let py=NODES[G.node].y;
if(animPos){const t=Math.min(1,animPos.t);px=lerp(animPos.x0,animPos.x1,t);py=lerp(animPos.y0,animPos.y1,t);}
ctx2d.font="6.5px sans-serif";ctx2d.textAlign="center";ctx2d.fillText("🛵",px,py-4.5);
ctx2d.strokeStyle="rgba(255,170,40,.7)";ctx2d.lineWidth=0.9;
ctx2d.beginPath();ctx2d.arc(px,py,5.5+Math.sin(T*6)*1,0,7);ctx2d.stroke();
requestAnimationFrame(drawMap);
}
cv.addEventListener("click",function(e){
if(!G||moving||isModalOpen())return;
const r=cv.getBoundingClientRect();
const lx=((e.clientX-r.left)*(cv.width/r.width)-(cv.width-VW*SC)/2)/SC;
const ly=((e.clientY-r.top)*(cv.height/r.height)-(cv.height-VH*SC)/2)/SC;
let bestN=null;let bd=9;
for(let i=0;i<NODES.length;i++){const n=NODES[i];const d=Math.hypot(n.x-lx,n.y-ly);if(d<bd){bd=d;bestN=n.id;}}
if(bestN!==null&&bestN!==G.node)tryMove(bestN);
});
setInterval(function(){for(let i=0;i<rainDrops.length;i++){const d=rainDrops[i];d.y+=d.v*0.03;if(d.y>172){d.y=-4;d.x=rnd(0,100);}}},30);
/* ============ 结算 ============ */
function settle(){
sfx.win();
const overtime=Math.max(0,Math.round(G.elapsed-G.deadline));
const loadMul=1+0.15*up.load;
const rows=[
[tx("sBase"),850],
[tx("sMile1")+G.moves+tx("sMile2"),G.moves*30],
[overtime>0?tx("sLate")+overtime+tx("sLate2"):tx("sOnTime"),overtime>0?-20*overtime:400],
[tx("sBonus"),G.orderBonus],
[tx("sRoad"),G.money]
];
let income=Math.round((850+G.moves*30+(overtime>0?-20*overtime:400)+G.orderBonus+G.money)*loadMul);
rows.push([tx("sLoad1")+(100+15*up.load)+"%",tx("sLoad2")]);
const R=income;const S=G.shan;let rank;
if(S>=60&&overtime<=8)rank=4;
else if(S>=55&&R>=900)rank=3;
else if(R>=1500)rank=1;
else if(S>=40)rank=2;
else rank=0;
const ed=ENDINGS[rank];
fund+=Math.floor(Math.max(0,income)*0.2);DB.set("fund",fund);
diaryTotal+=G.diary.length;DB.set("diaryTotal",diaryTotal);
if(rank>best){best=rank;DB.set("best",best);}
const newAch=[];
const unlock=function(k){if(!ach[k]){ach[k]=1;newAch.push(k);}};
if(rank===4)unlock("eye");
if(rank===2)unlock("hero");
if(up.range>=3&&up.speed>=3&&up.load>=3)unlock("master");
if(diaryTotal>=20)unlock("writer");
DB.set("ach",ach);
let h="<div class='titleBadge'>"+fmtClock()+tx("sEasing")+"</div>";
h+="<div class='endTitle' style='color:"+ed.color+"'>"+tr(ed.name,ed.en_name)+"</div>";
h+="<div class='storyBox'>"+tr(ed.text,ed.en_text)+"</div>";
h+="<div class='kv' style='margin:10px 0'>"+tx("sShan")+" <b>"+G.shan+"</b> · "+tx("sTime")+" <b>"+Math.round(G.elapsed)+tx("sMin")+"</b>"+(overtime>0?" · "+tx("sLate3")+" <b style='color:#ff6b6b'>"+overtime+tx("sMin")+"</b>":" · <b style='color:#7ddf9a'>"+tx("sNoLate")+"</b>")+"</div>";
h+="<h3 style='margin:14px 0 6px'>"+tx("sBill")+"</h3>";
rows.forEach(function(r){h+="<div class='billRow'><span>"+r[0]+"</span><span>"+(typeof r[1]==="number"?(r[1]>=0?"+":"")+r[1]:""+r[1])+"</span></div>";});
h+="<div class='billRow total'><span>"+tx("sTotal")+"</span><span>"+income+tx("sYuan")+"</span></div>";
h+="<div class='kv' style='margin:8px 0'>"+tx("sFund1")+Math.floor(Math.max(0,income)*0.2)+tx("sFund2")+fund+tx("sFund3")+"</div>";
if(newAch.length){h+="<h3 style='margin:14px 0 6px'>"+tx("sNewAch")+"</h3>";newAch.forEach(function(k){const a=ACH_DEFS.find(function(x){return x.k===k;});h+="<div class='achItem'><span>"+tr(a.name,a.en_name)+"</span><span class='kv'>"+tr(a.desc,a.en_desc)+"</span></div>";});}
h+="<h3 style='margin:14px 0 6px'>"+tx("sDiaryT1")+G.diary.length+tx("sDiaryT2")+"</h3>";
if(!G.diary.length)h+="<div class='kv'>"+tx("diaryEmpty")+"</div>";
G.diary.forEach(function(d){h+="<div class='diaryLine'>"+d+"</div>";});
h+="<button class='btn btn-p' id='btnAgain' style='margin-top:16px'>"+tx("sAgain")+"</button>";
h+="<button class='btn btn-s' id='btnHome'>"+tx("sHome")+"</button>";
$("endContent").innerHTML=h;showScreen("endScreen");
$("btnAgain").onclick=function(){sfx.click();startFlow();};
$("btnHome").onclick=function(){sfx.click();showScreen("startScreen");renderLang();};
}
/* ============ 改装铺 / 成就 / 说明 ============ */
function openShop(){
sfx.click();
let h="<div class='kv' style='margin-bottom:10px'>"+tx("shFund1")+fund+tx("shFund2")+"</div>";
UPGRADES.forEach(function(u){
const lv=up[u.k];const maxed=lv>=3;const cost=maxed?null:u.costs[lv];
h+="<div class='shopItem'><h4>"+tr(u.name,u.en_name)+"</h4><p>"+tr(u.desc,u.en_desc)+"</p><div class='pips'>"+"●".repeat(lv)+"○".repeat(3-lv)+"</div>";
h+="<button class='btn btn-s' data-up='"+u.k+"' "+(maxed||fund<cost?"disabled":"")+">"+(maxed?tx("shMax"):tx("shUp")+cost+tr("元",""))+"</button></div>";
});
openModal(tx("shT"),"",[]);
$("modalCard").innerHTML="<h3>"+tx("shT")+"</h3>"+h+"<button class='btn btn-s' id='shopClose'>"+tx("shClose")+"</button>";
const ups=$("modalCard").querySelectorAll("[data-up]");
ups.forEach(function(b){b.onclick=function(){
const k=b.getAttribute("data-up");
const u=UPGRADES.find(function(x){return x.k===k;});
const cost=u.costs[up[k]];
if(fund<cost)return;
fund-=cost;up[k]++;DB.set("fund",fund);DB.set("up",up);
sfx.coin();toast(tr(u.name,u.en_name)+tx("shToast1")+up[k]+tx("shToast2"));openShop();
};});
$("shopClose").onclick=function(){sfx.click();$("modal").classList.remove("on");refreshStartMeta();};
}
function openAch(){
sfx.click();
let h="";
ACH_DEFS.forEach(function(a){const un=ach[a.k];h+="<div class='achItem"+(un?"":" locked")+"'><span>"+(un?tr(a.name,a.en_name):"🔒 ???")+"</span><span class='kv'>"+tr(a.desc,a.en_desc)+"</span></div>";});
h+="<div class='kv' style='margin-top:10px'>"+tx("aBest")+"<b>"+(best>=0?tr(ENDINGS[best].name,ENDINGS[best].en_name):tx("aNone"))+"</b></div>";
h+="<div class='kv'>"+tx("aRep")+DISTRICTS.map(function(d){return distName(d)+":"+(rep[d]||0);}).join(" · ")+"</div>";
openInfo(tx("aT"),h);
}
function openHow(){
openInfo(tx("hT"),
"<div class='howRow'>"+tx("hHow")+"</div>"+
"<div class='howRow'>"+tx("hR1")+"</div>"+
"<div class='howRow'>"+tx("hR2")+"</div>"+
"<div class='howRow'>"+tx("hR3")+"</div>"+
"<div class='howRow'>"+tx("hR4")+"</div>"+
"<div class='howRow win'>"+tx("hWin")+"</div>"+
"<div class='howRow lose'>"+tx("hLose")+"</div>"+
"<details class='endFold'><summary>"+tx("hFold")+"</summary>"+
"<div class='howRow'>"+tx("hE0")+"</div>"+
"<div class='howRow'>"+tx("hE1")+"</div>"+
"<div class='howRow'>"+tx("hE2")+"</div>"+
"<div class='howRow'>"+tx("hE3")+"</div>"+
"<div class='howRow'>"+tx("hE4")+"</div></details>");
}
/* ============ 流程 ============ */
function showScreen(id){
const ss=document.querySelectorAll(".screen");
ss.forEach(function(s){s.classList.remove("on");});
$(id).classList.add("on");
if(id==="gameScreen")setTimeout(resizeMap,50);
}
function refreshStartMeta(){
$("startMeta").innerHTML=tx("mFund1")+fund+tx("mFund2")+(best>=0?tr(ENDINGS[best].name,ENDINGS[best].en_name):tx("aNone"))+tx("mDiary1")+diaryTotal+tx("mDiary2");
}
function startFlow(){
const maxRep=Math.max.apply(null,DISTRICTS.map(function(d){return rep[d]||0;}).concat([0]));
if(maxRep>=30){
const dName=DISTRICTS.find(function(d){return (rep[d]||0)>=30;});
openModal(tx("sfT"),"<div class='body'>"+distName(dName)+tx("sfB1")+"</div>",[
{label:tx("sfBig"),cost:tx("sfBigC"),fn:function(){newRun("big");}},
{label:tx("sfNear"),cost:tx("sfNearC"),fn:function(){newRun("near");}},
{label:tx("sfNormal"),cost:"",fn:function(){newRun("normal");}}
]);
}else{newRun("normal");}
}
$("btnMute2").onclick=toggleMute;
$("btnLang2").onclick=function(){sfx.click();setLang(LANG==="en"?"zh":"en");};
$("btnAccel").onclick=function(){
if(!G)return;
G.accel=!G.accel;G.accelLeft=G.accel?9999:0;
$("btnAccel").classList.toggle("tglOn",G.accel);
toast(G.accel?tx("tBoostOn"):tx("tBoostOff"));sfx.click();updateRoute();
};
$("btnDiaryLook").onclick=function(){
if(!G||!G.diary.length){toast(tx("tNoDiary"));return;}
openInfo(tx("diaryT"),G.diary.map(function(d){return "<div class='diaryLine'>"+d+"</div>";}).join(""));
};
/* ============ 启动 ============ */
renderLang();resizeMap();drawMap();
</script>
