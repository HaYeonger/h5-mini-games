<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>年会求生 · 活着散场</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#14161c;--panel:#1e222c;--panel2:#262b38;--gold:#e8b34b;--red:#e05c5c;--green:#5fd08a;--blue:#5aa9e6;--txt:#eef0f5;--mut:#9aa0ae}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.55;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100%;padding:12px 12px 90px;position:relative}
.screen{display:none}
.screen.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1.logo{text-align:center;font-size:34px;letter-spacing:6px;margin:26px 0 4px;color:var(--gold);text-shadow:0 2px 18px rgba(232,179,75,.25)}
.sub{text-align:center;color:var(--mut);font-size:13px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid #2e3442;border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:16px;margin-bottom:6px;color:var(--gold)}
.btn{display:block;width:100%;background:var(--panel2);border:1px solid #3a4152;color:var(--txt);border-radius:12px;padding:12px;margin:8px 0;font-size:15px;text-align:left;cursor:pointer}
.btn:active{transform:scale(.985);background:#2e3444}
.btn.primary{background:linear-gradient(135deg,#b97f1f,#e8b34b);border:none;color:#1a1405;font-weight:700;text-align:center;font-size:17px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn .fx{display:block;font-size:12px;color:var(--mut);margin-top:4px}
.opt-persona{border:2px solid #2e3442}
.opt-persona.sel{border-color:var(--gold);background:#2a2415}
.topbar{position:sticky;top:0;z-index:20;background:rgba(20,22,28,.96);backdrop-filter:blur(6px);padding:8px 2px 6px;border-bottom:1px solid #2e3442}
.roundline{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mut);margin-bottom:6px}
.stat{margin:5px 0}
.statwarn{font-size:12px;color:var(--red);margin:3px 0;font-weight:700;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.45}}
.stat .row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px}
.bar{height:8px;background:#2a2f3b;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;transition:width .3s}
.hand{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}
.pcard{flex:0 0 118px;background:var(--panel2);border:1px solid #3a4152;border-radius:10px;padding:8px;font-size:12px;cursor:pointer}
.pcard:active{transform:scale(.96)}
.pcard .nm{font-weight:700;font-size:13px;color:var(--gold);margin-bottom:2px}
.pcard .cost{color:var(--blue);font-size:11px}
.pcard .cmbb{display:inline-block;font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:0 8px;margin-top:4px}
.pcard.played{opacity:.35;pointer-events:none}
.evtitle{font-size:19px;font-weight:800;margin-bottom:6px}
.evdesc{color:#cfd4de;font-size:14px;margin-bottom:4px}
.tag{display:inline-block;font-size:11px;background:#2a2f3b;color:var(--mut);border-radius:20px;padding:2px 10px;margin:2px 4px 2px 0}
#log{background:#101218;border:1px solid #2e3442;border-radius:12px;padding:10px;height:150px;overflow-y:auto;font-size:13px;color:#c6cbd6;margin-top:6px}
#log div{margin-bottom:4px}
#log .good{color:var(--green)} #log .bad{color:var(--red)} #log .gold{color:var(--gold)}
.netwrap{text-align:center}
#npcnet{width:100%;height:auto}
.secttl{font-size:13px;color:var(--mut);margin:14px 0 6px;letter-spacing:2px}
.big{font-size:40px;text-align:center;margin:10px 0}
.center{text-align:center}
.muted{color:var(--mut);font-size:13px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #2e3442;font-size:14px}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:30px;font-size:14px;z-index:99;white-space:nowrap;animation:fade .3s}
.mutebtn{position:fixed;right:14px;bottom:20px;z-index:50;width:44px;height:44px;border-radius:50%;background:var(--panel2);border:1px solid #3a4152;color:var(--txt);font-size:18px}
.achline{font-size:13px;color:var(--gold);margin:4px 0}
.howto .howrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #2e3442}
.howto .howrow:last-child{border-bottom:none;padding-bottom:2px}
.howem{font-size:22px;line-height:1.35}
.howrow b{display:block;font-size:14px}
.howrow span{font-size:12.5px;color:var(--mut)}
.winline{border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px;border:1px solid;line-height:1.5}
.winline.win{border-color:#3f6b4f;background:#16241b;color:var(--green)}
.winline.lose{border-color:#6b3f3f;background:#241616;color:var(--red)}
.winline b{color:var(--txt)}
details.fold summary{cursor:pointer;font-size:15px;font-weight:700;color:var(--gold);list-style:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary:before{content:'▸ ';color:var(--mut)}
details.fold[open] summary:before{content:'▾ '}
.fold table{width:100%;font-size:13px;border-collapse:collapse;margin-top:6px}
.fold td{padding:7px 4px;border-bottom:1px dashed #2e3442;vertical-align:top}
.fold td:first-child{white-space:nowrap;font-size:16px;padding-right:8px}
.fold .cmb{color:var(--gold);font-size:13px;margin:6px 0}

</style>
</head>
<body>
<div id="app">

<!-- 开始屏 -->
<div class="screen on" id="scr-start">
  <h1 class="logo" data-t="logo">年会求生</h1>
  <div class="sub" data-t="tagline">活着散场 · 一场酒桌上的潜行游戏</div>
  <div class="center" style="margin-bottom:14px"><button class="btn ghost" id="langBtnHome" style="width:auto;display:inline-block;padding:6px 20px;font-size:13px;text-align:center">🇺🇸 English</button></div>
  <div class="card howto" id="howtoCard"></div>
  <div class="winline win" data-t="winWin">👑 <b>最高评级「老板心腹」</b>：老板好感 ≥90 <b>且</b>零社死</div>
  <div class="winline lose" data-t="winLose">💀 <b>直接「社死现场」</b>：社死 ≥2，当场出局</div>
  <details class="card fold"><summary data-t="foldPersonaT">🎭 人设详解</summary>
    <table id="personaTable"></table>
  </details>
  <details class="card fold"><summary data-t="advT">🃏 进阶：combo · 隐藏选项 · 职位</summary>
    <div id="advBody"></div>
  </details>
  <div class="card"><h3 data-t="choosePersona">🎭 选择你的人设</h3><div id="personaPick"></div></div>
  <button class="btn primary" id="btnToPrep" data-t="btnToPrep">下一步：战前准备 →</button>
  <div class="center muted" style="margin-top:10px" id="bestLine"></div>
</div>

<!-- 准备屏 -->
<div class="screen" id="scr-prep">
  <h1 class="logo" style="font-size:24px" data-t="prepTitle">战前准备</h1>
  <div class="sub" id="prepInfo"></div>
  <div class="card"><h3 data-t="teaTitle">🍵 以茶代酒</h3>
    <div class="muted" style="margin-bottom:8px" data-t="teaDesc">花 <b>10 点人缘</b> 提前准备 3 杯"特调茶"，敬酒时可偷梁换柱（老板好感照涨不误）。</div>
    <button class="btn" id="btnBuyTea" data-t="btnBuyTea">兑换 3 杯特调茶（人缘-10）</button>
    <div class="muted" id="teaInfo">当前：0 杯</div>
  </div>
  <button class="btn primary" id="btnStart" data-t="btnStart">🔥 入场！年会开始</button>
</div>

<!-- 游戏屏 -->
<div class="screen" id="scr-game">
  <div class="topbar">
    <div class="roundline"><span id="roundLab">第 1 / 10 轮</span><span id="posLab"></span><span id="teaLab">🍵×0</span><button class="btn ghost" id="langBtnTop" style="width:auto;padding:2px 10px;font-size:12px;margin:0">🇺🇸 EN</button></div>
    <div id="stats"></div>
    <div id="washRow"></div>
  </div>
  <div class="secttl" data-t="netTitle">🕸️ 人脉网络 <span class="muted">（点击展开）</span></div>
  <div class="card netwrap" id="netCard" style="display:none"><svg id="npcnet" viewBox="0 0 400 240"></svg></div>
  <div class="card" id="evCard"><div class="evtitle" id="evTitle"></div><div id="evTags"></div><div class="evdesc" id="evDesc"></div><div id="evOpts"></div></div>
  <div class="secttl">🃏 话术手牌 <span class="muted" id="handHint">（每轮限打 2 张）</span></div>
  <div class="hand" id="hand"></div>
  <div class="secttl" data-t="feedTitle">📝 晚宴实况</div>
  <div id="log"></div>
</div>

<!-- 结算屏 -->
<div class="screen" id="scr-end">
  <h1 class="logo" style="font-size:26px" data-t="endTitle">散场结算</h1>
  <div class="big" id="endEmoji">🎉</div>
  <div class="center" style="font-size:22px;font-weight:800;color:var(--gold)" id="endRating"></div>
  <div class="center muted" id="endComment" style="margin:6px 0 12px"></div>
  <div class="card" id="endStats"></div>
  <div class="card"><h3 data-t="achTitle">🏅 成就</h3><div id="endAch"></div></div>
  <button class="btn primary" id="btnAgain" data-t="btnAgain">🔄 再战一年</button>
  <button class="btn ghost center" id="btnHome" style="text-align:center" data-t="btnHome">回首页换人设</button>
</div>

</div>
<button class="mutebtn" id="muteBtn" title="声音">🔊</button>
<script>
'use strict';
/* ============ 基础 ============ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ============ I18N ============ */

get(k,d){try{const v=localStorage.getItem('nianhui_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},

};
let LANG=(function(){const s=store.get('nh_lang',null);if(s==='en'||s==='zh')return s;
return (navigator.language||'zh').toLowerCase().indexOf('en')===0?'en':'zh';})();
function tx(o,k){return (LANG==='en'&&o[k+'_en']!=null)?o[k+'_en']:o[k];}
const I18N={
title:{zh:'年会求生 · 活着散场',en:'Holiday Party Survival · Survive the Night'},
logo:{zh:'年会求生',en:'Party Survival'},

+'<div class="howrow"><span class="howem">🃏</span><div><b>话术手牌，每轮可打 2 张</b><span>打牌耗清醒；凑对 combo 有奇效</span></div></div>'
+'<div class="howrow"><span class="howem">🫣</span><div><b>别社死</b><span>酒量/清醒归零各 +1 社死，嘴比酒量先崩</span></div></div>'
+'<div class="howrow"><span class="howem">👔</span><div><b>刷老板好感</b><span>吹、敬、端水，目标直指 90 分</span></div></div>',
en:'<h3>🎮 How to play <span class="muted" style="font-weight:400;font-size:12px">· 30-second start</span></h3>'

+'<div class="howrow"><span class="howem">👔</span><div><b>Win the boss\'s favor</b><span>Flatter, toast, schmooze — aim for 90</span></div></div>'},
winWin:{zh:'👑 <b>最高评级「老板心腹」</b>：老板好感 ≥90 <b>且</b>零社死',en:'👑 <b>Top rating "Boss\'s Favorite"</b>: boss favor ≥90 <b>and</b> zero social deaths'},
winLose:{zh:'💀 <b>直接「社死现场」</b>：社死 ≥2，当场出局',en:'💀 <b>Instant "Party Foul"</b>: 2+ social deaths and you\'re done'},
foldPersonaT:{zh:'🎭 人设详解',en:'🎭 Persona details'},
advT:{zh:'🃏 进阶：combo · 隐藏选项 · 职位',en:'🃏 Advanced: combos · hidden options · titles'},

bestLineNew:{zh:'新的一年，新的年会，新的劫。',en:'New year, new party, new perils.'},
bestLineHas:{zh:'历史最高年终奖：',en:'Best bonus: '},
bestLinePos:{zh:' · 当前开局职位：',en:' · Starting title: '},

roundFmt:{zh:'第 {r} / 10 轮',en:'Round {r} / 10'},
statJiu:{zh:'酒量',en:'Tolerance'},statQing:{zh:'清醒',en:'Composure'},statBoss:{zh:'老板好感',en:'Boss favor'},statRen:{zh:'人缘',en:'Popularity'},
warnJiu:{zh:'⚠️ 酒量告急：再喝就断片（+1 社死）！',en:'⚠️ Tolerance critical: one more drink = blackout (+1 social death)!'},

kvPromoted:{zh:'（↑升职！）',en:' (↑ promoted!)'},kvNewRec:{zh:' <span style="color:var(--gold)">新纪录！</span>',en:' <span style="color:var(--gold)">New record!</span>'},
kvJQ:{zh:'酒量 / 清醒',en:'Tolerance / Composure'},kvBR:{zh:'老板好感 / 人缘',en:'Boss favor / Popularity'},
kvShesi:{zh:'社死次数',en:'Social deaths'},kvShesiUnit:{zh:' 次',en:''},kvHb:{zh:'红包小金库',en:'Raffle stash'},

achTotal:{zh:'累计成就：',en:'All achievements: '},achNone:{zh:'无',en:'none'},

achA1:{zh:'全身而退（零社死通关）',en:'Clean Getaway (zero social deaths)'},
achA2:{zh:'端水大师（所有NPC好感≥60）',en:'Diplomat (all NPC favor ≥60)'},

function T(k){const e=I18N[k];return LANG==='en'?e.en:e.zh;}
function tf(k,m){let s=T(k);for(const x in m)s=s.replace('{'+x+'}',m[x]);return s;}

/* ============ 音效 ============ */
let muted=false, AC=null;
function beep(f,d,type){ if(muted)return; try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  const o=AC.createOscillator(),g=AC.createGain(); o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(.08,AC.currentTime); g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);
  o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime+d);}catch(e){} }
const sfx={ click:()=>beep(600,.06,'square'), card:()=>beep(880,.08,'triangle'),
  good:()=>{beep(523,.1);setTimeout(()=>beep(784,.12),90);}, bad:()=>{beep(220,.15,'sawtooth');setTimeout(()=>beep(147,.2,'sawtooth'),120);} };
$('muteBtn').onclick=()=>{muted=!muted;$('muteBtn').textContent=muted?'🔇':'🔊';};

/* ============ 常量数据 ============ */

 {name:'主管',name_en:'Manager',coeff:1.5,danger:.22},
 {name:'总监',name_en:'Director',coeff:2.0,danger:.32}];
function posName(i){return tx(POSITIONS[i],'name');}
const RATING_IDX={'社死现场':0,'透明人':1,'气氛组':2,'老板心腹':3};
const PERSONAS={

 e21:{card:'shangye',t:'💼 商业互吹开场白',t_en:'💼 Mutual-Hype Opener',sub:'打出【商业互吹】',sub_en:'Play [Mutual Hype]',fx:{boss:18,qing:-5},log:'三句话把项目包装成集团战略方向，陈总眼睛亮了："年后细聊！"',log_en:'Three sentences framing the project as group strategy. Mr. Carter\'s eyes light up: "Let\'s dig in next year!"'},

 e7:{card:'jiuzhuo',t:'🎤 酒桌文学式总结',t_en:'🎤 Toastmaster-Style Review',sub:'打出【酒桌文学】',sub_en:'Play [Toastmaster Prose]',fx:{boss:15,ren:8,qing:-8},log:'你把Q1到Q4讲成了评书，陈总带头鼓掌，Lisa偷偷录了视频。',log_en:'You turn Q1–Q4 into a stand-up routine. Mr. Carter leads the applause; Lisa secretly records it.'}
};
function cardName(id){const c=CARDS.find(x=>x.id===id);if(!c)return '';const n=tx(c,'nm');return LANG==='en'?'['+n+']':'【'+n+'】';}
/* combo搭档：id→id，只用于展示，帮助玩家凑combo */
const COMBO_MATE={shangye:'zhuanyi',zhuanyi:'shangye',caihong:'jiuzhuo',jiuzhuo:'caihong',duanshui:'kuakua',kuakua:'duanshui'};
function comboBadge(c){const m=COMBO_MATE[c.id];if(!m)return '';const mc=CARDS.find(x=>x.id===m);return '<div class="cmbb">✨ combo·'+(mc?tx(mc,'nm'):m)+'</div>';}
function hiddenOptFor(ev){const h=HIDDEN_OPTS[ev.id];if(!h||!S||!S.hand)return null;return S.hand.some(c=>c.id===h.card)?h:null;}

/* ============ 存档（store 已在 I18N 段定义） ============ */

/* ============ 状态 ============ */
let S=null, deck=[], selPersona='haoliang';
function newState(personaKey){
const p=PERSONAS[personaKey], posIdx=store.get('pos',0);
const npc={}; NPCS.forEach(n=>npc[n.id]=50);
return {persona:personaKey,posIdx,round:0,jiu:100+(p.mod.jiu||0),jiuMax:100+(p.mod.jiu||0),
qing:100+(p.mod.qing||0),qingMax:100+(p.mod.qing||0),boss:50,ren:50+(p.mod.ren||0),
tea:0,hb:0,shesiRaw:0,washUsed:false,washShield:false,npc,hand:[],played:0,flags:{},lietou:false,log:[],over:false};
}
function effShesi(){return Math.floor(S.shesiRaw+1e-9);}
function log(html,cls){S.log.push({html,cls});const el=$('log');const d=document.createElement('div');if(cls)d.className=cls;d.innerHTML=html;el.appendChild(d);el.scrollTop=el.scrollHeight;}

/* ============ 人设选择 ============ */
function renderPersona(){
$('personaPick').innerHTML=Object.keys(PERSONAS).map(k=>{const p=PERSONAS[k];
return '<button class="btn opt-persona'+(selPersona===k?' sel':'')+'" data-k="'+k+'"><b>'+p.emoji+' '+tx(p,'name')+'</b> <span class="muted">'+tx(p,'tip')+'</span><span class="fx">'+tx(p,'desc')+'</span></button>';}).join('');
document.querySelectorAll('#personaPick .btn').forEach(b=>b.onclick=()=>{sfx.click();selPersona=b.dataset.k;renderPersona();});
$('personaTable').innerHTML=Object.keys(PERSONAS).map(k=>{const p=PERSONAS[k];
return '<tr><td>'+p.emoji+'</td><td><b>'+tx(p,'name')+'</b> · '+tx(p,'tip')+'<br><span class="muted">'+tx(p,'desc')+'</span></td></tr>';}).join('');
renderAdv();
const best=store.get('best',0),bp=store.get('pos',0);
$('bestLine').textContent=best>0?(T('bestLineHas')+'$'+best+T('bestLinePos')+posName(bp)):T('bestLineNew');
}
function renderAdv(){
const cn=id=>{const c=CARDS.find(x=>x.id===id);return c?tx(c,'nm'):id;};
const posList=POSITIONS.map(p=>tx(p,'name')).join('→');
$('advBody').innerHTML=
 '<div class="cmb">✨ <b>'+(LANG==='en'?'Play these two in the same round':'同轮打出')+'</b>'+(LANG==='en'?' for a combo:':'以下两张即触发 combo:')+'</div>'
 +'<div class="muted" style="font-size:13px">'+cn('shangye')+' + '+cn('zhuanyi')+' → '+T('statBoss')+'+15<br>'+cn('caihong')+' + '+cn('jiuzhuo')+' → '+T('statBoss')+'+20<br>'+cn('duanshui')+' + '+cn('kuakua')+' → '+T('statRen')+'+15</div>'
 +'<div class="cmb" style="margin-top:10px">'+(LANG==='en'?'🗝️ <b>Hidden options</b>: in certain events, holding the matching tactic card reveals a <b style="color:var(--gold)">gold option</b> — playing it consumes the card. Use it now or save it for a combo — your call.'
  :'🗝️ <b>隐藏选项</b>：特定事件中，手里有对应话术牌会出现<b style="color:var(--gold)">金色选项</b>——打出该牌解锁（牌会消耗，留着还是现在用，自己掂量）。')+'</div>'
 +'<div class="cmb" style="margin-top:10px">'+(LANG==='en'?'🎭 <b>Self-roast save</b>: usable when social deaths &gt;0 and composure ≥60, once per game — drains composure, clears 1 social death.'
  :'🎭 <b>自黑解围</b>：社死&gt;0 且清醒≥60 时可用，本局一次——清空清醒，洗白 1 点社死。')+'</div>'
 +'<div class="muted" style="font-size:13px;margin-top:10px">'+(LANG==='en'?'🪜 Tonight\'s rating sets your <b>starting title</b> next game: '+posList+'. Higher titles, bigger rewards — and nastier events. NPCs at favor ≤20 will <b>settle scores</b> in rounds 5/8/10.'
  :'🪜 本局评级决定<b>下局开局职位</b>：'+posList+'。职位越高奖励越高，事件也越凶险。8 位 NPC 好感≤20 会在第 5/8/10 轮「秋后算账」。')+'</div>';
}
$('btnToPrep').onclick=()=>{sfx.click();S=newState(selPersona);show('scr-prep');renderPrep();};

/* ============ 准备阶段 ============ */
function renderPrep(){
const p=PERSONAS[S.persona];
$('prepInfo').textContent=(LANG==='en'?'Persona: ':'人设：')+p.emoji+tx(p,'name')+'（'+tx(p,'tip')+'）'+(LANG==='en'?' · Starting title: ':' · 开局职位：')+posName(S.posIdx);
$('teaInfo').textContent=(LANG==='en'?'Now: ':'当前：')+S.tea+(LANG==='en'?' mocktails · Popularity: ':' 杯 · 人缘：')+S.ren;
$('btnBuyTea').disabled=S.ren<10;
}
$('btnBuyTea').onclick=()=>{if(S.ren<10)return;sfx.card();S.ren-=10;S.tea+=3;log(LANG==='en'?'🍸 Spent 10 popularity on 3 mocktails.':'🍵 花10点人缘，备好3杯特调茶。','gold');renderPrep();};
$('btnStart').onclick=()=>{sfx.good();show('scr-game');startGame();};

/* ============ 游戏流程 ============ */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');}
function startGame(){
$('log').innerHTML='';S.log=[];
deck=shuffle(EVENTS);
log('🎊 '+(LANG==='en'?'The party begins! You are <b>':'年会开始！你是<b>')+tx(PERSONAS[S.persona],'name')+'</b>'+(LANG==='en'?', entering as <b>':'，以<b>')+posName(S.posIdx)+'</b>'+(LANG==='en'?'':'身份入场。'),'gold');
log(LANG==='en'?'Goal: survive 10 rounds and leave with dignity.':'目标：活过10轮，体面散场。','gold');
nextRound();
}
function drawCards(){
const n=S.persona==='sheNiu'?3:2;
let guard=0;
for(let i=0;i<n&&S.hand.length<6;i++){
if(++guard>300)break;
let c=pick(CARDS);
if(S.hand.filter(h=>h.id===c.id).length>=2){i--;continue;}
S.hand.push(Object.assign({},c));
}
}
function nextRound(){
S.round++;S.played=0;S.flags={};S._roundShesi=0;S._playedNames=[];
if(S.round>10)return endGame();
// 秋后算账
if([5,8,10].indexOf(S.round)>=0){
const bad=NPCS.filter(n=>S.npc[n.id]<=20);
if(bad.length){const v=pick(bad);
S.boss=clamp(S.boss-10,0,100);S.ren=clamp(S.ren-5,0,150);
log(LANG==='en'?'🌩️ <b>Score settled</b>: '+npcName(v.id)+' bad-mouthed you to Mr. Carter. Boss favor −10, popularity −5.':'🌩️ <b>秋后算账</b>：'+v.name+'在陈总面前阴阳了你一句，老板好感-10，人缘-5。','bad');sfx.bad();}
}
drawCards();
const ev=deck[(S.round-1)%deck.length];
renderAll(ev);
log((LANG==='en'?'—— Round ':'—— 第 ')+S.round+(LANG==='en'?' / 10: <b>':' / 10 轮：<b>')+tx(ev,'name')+'</b> ——');
}
function currentEvent(){return deck[(S.round-1)%deck.length];}

/* ---- 出牌 ---- */
function playCard(idx){
const c=S.hand[idx];if(!c||S.played>=2)return;
if(S.qing<c.cost){toast(T('notEnoughQing'));return;}
sfx.card();S.qing=clamp(S.qing-c.cost,0,S.qingMax);S.played++;
S.hand.splice(idx,1);
log(tf('playedCard',{c:c.cost}));
applyFx(c.fx||{},'card');
if(c.sp==='zhuanyi'){const others=NPCS.filter(n=>n.id!=='boss');const v=pick(others);S.npc[v.id]=clamp(S.npc[v.id]-5,0,100);log(npcName(v.id)+(LANG==='en'?' favor −5 (deflection successful)':'好感-5（火力转移成功）'),'bad');}
if(c.sp==='duanshui'){NPCS.forEach(n=>S.npc[n.id]=clamp(S.npc[n.id]+4,0,100));log(LANG==='en'?'All NPC favor +4. Diplomacy!':'所有NPC好感+4，雨露均沾。','good');}
if(c.sp==='qingting'){const v=pick(NPCS);S.npc[v.id]=clamp(S.npc[v.id]+6,0,100);log(npcName(v.id)+(LANG==='en'?" thinks you're a great listener. Favor +6.":'觉得你是个很好的倾听者，好感+6。'),'good');}
if(c.sp==='yiku'){S.npc.zhishu=clamp(S.npc.zhishu+8,0,100);log('Lisa '+(LANG==='en'?'favor +8.':'好感+8。'),'good');}
if(c.sp==='beiguo'){S.npc.zhishu=clamp(S.npc.zhishu+10,0,100);log('Lisa '+(LANG==='en'?'favor +10: reliable when it counts.':'好感+10：关键时刻还是你靠得住。'),'good');}
if(c.sp==='hexini'){let w=NPCS[0];NPCS.forEach(n=>{if(S.npc[n.id]<S.npc[w.id])w=n;});S.npc[w.id]=clamp(S.npc[w.id]+10,0,100);log((LANG==='en'?'You smooth things over. ':'你撮合了一下，')+npcName(w.id)+(LANG==='en'?' favor +10.':'好感+10。'),'good');}
if(c.sp==='zihei'){S.flags.zihei=true;log(LANG==='en'?'Self-roast ready: blocks 1 social death this round.':'已备好自黑话术，本轮可抵消1次社死。');}
if(c.sp==='zhuangsha'){S.flags.zhuangsha=true;log(LANG==='en'?'Playing dumb: alcohol damage halved this round.':'装傻模式启动：本轮酒量消耗减半。');}
if(c.sp==='jingjiu'){S.flags.jingjiu=true;log(LANG==='en'?'Toast library loaded: real-drink damage halved.':'敬酒词库加载：本轮真喝伤害减半。');}
if(c.sp==='lietou'||c.id==='dummy'){}
// combo判定
const names=S._playedNames||(S._playedNames=[]);names.push(c.id);
const has=id=>names.indexOf(id)>=0;
if(has('shangye')&&has('zhuanyi')&&!S.flags['cA']){S.flags.cA=1;S.boss=clamp(S.boss+15,0,100);log('✨ <b>COMBO</b>'+(LANG==='en'?': boss favor +15!':'：老板好感+15！'),'gold');sfx.good();}
if(has('caihong')&&has('jiuzhuo')&&!S.flags['cB']){S.flags.cB=1;S.boss=clamp(S.boss+20,0,100);log('✨ <b>COMBO</b>'+(LANG==='en'?': boss favor +20!':'：老板好感+20！'),'gold');sfx.good();}
if(has('duanshui')&&has('kuakua')&&!S.flags['cC']){S.flags.cC=1;S.ren=clamp(S.ren+15,0,150);log('✨ <b>COMBO</b>'+(LANG==='en'?': popularity +15!':'：人缘+15！'),'gold');sfx.good();}
if(c.sp==='skip'){
document.querySelectorAll('#evOpts .btn').forEach(b=>b.disabled=true);
log(LANG==='en'?'📞 "Hello? Bad signal…" You flawlessly miss this round\'s event.':'📞 "喂？啊信号不好…"你完美错过了本轮事件。','gold');
S.flags.skipped=true;setTimeout(()=>{checkZero();renderStats();nextRound();},700);return;
}
checkZero();renderAll(currentEvent());
}
/* ---- 结算选项 ---- */
function fmtFx(fx){
const parts=[];const em={jiu:'🍺',qing:'☕',boss:'👔',ren:'🤝',hb:'🧧',shesi:'💀',tea:'🍵'};
for(const k in fx){if(k==='tea'||fx[k]===0)continue;
const v=fx[k];parts.push(em[k]+(v>0?'+':'')+v);}
return parts.join(' ');
}
function applyFx(fx,src){
const danger=1+POSITIONS[S.posIdx].danger;
const neg=v=>Math.round(v*danger);
if(fx.jiu){let v=fx.jiu;if(v<0){if(S.flags.zhuangsha)v=Math.ceil(v/2);if(src==='toast-zhen'&&S.flags.jingjiu)v=Math.ceil(v/2);}
S.jiu=clamp(S.jiu+v,0,S.jiuMax);}
if(fx.qing)S.qing=clamp(S.qing+fx.qing,0,S.qingMax);
if(fx.boss){let v=fx.boss;if(v>0&&S.persona==='yinXing')v=Math.round(v*0.7);if(v<0)v=neg(v);S.boss=clamp(S.boss+v,0,100);}
if(fx.ren){let v=fx.ren;if(v<0)v=neg(v);S.ren=clamp(S.ren+v,0,150);}
if(fx.hb)S.hb+=fx.hb;
if(fx.shesi)addShesi(fx.shesi);
}
function addShesi(n){S.shesiRaw+= (S.persona==='yinXing'?n*0.5:n);}
function chooseOpt(oi){
const ev=currentEvent(),o=ev.opts[oi];sfx.click();
document.querySelectorAll('#evOpts .btn').forEach(b=>b.disabled=true);
if(o.tea&&S.tea<=0){toast(T('noTeaToast'));return;}
if(o.tea){S.tea--;}
log(T('youChoose')+tx(o,'t'));
if(ev.type==='toast'&&oi===0)applyFx(o.fx,'toast-zhen');else applyFx(o.fx||{});
if(o.npc)for(const k in o.npc){S.npc[k]=clamp(S.npc[k]+o.npc[k],0,100);}
if(o.sp==='lietou'){S.lietou=true;}
if(o.log)log(o.log, (o.fx&&(o.fx.boss>0||o.fx.ren>0))?'good':'');
// 以茶代酒选项的fx里boss已含
checkZero();
// 自黑抵消
if(S.flags.zihei&&S._roundShesi>0){S._roundShesi--;S.shesiRaw=Math.max(0,S.shesiRaw-(S.persona==='yinXing'?0.5:1));log(LANG==='en'?'🃏 Self-roast saves you: 1 social death blocked!':'🃏 自黑解围生效：抵消1次社死！','gold');}
setTimeout(()=>nextRound(),650);
renderStats();
}
/* ---- 持牌隐藏选项结算 ---- */
function chooseHidden(){
const ev=currentEvent(),h=hiddenOptFor(ev);if(!h)return;sfx.card();
document.querySelectorAll('#evOpts .btn').forEach(b=>b.disabled=true);
const ci=S.hand.findIndex(c=>c.id===h.card);
if(ci>=0)S.hand.splice(ci,1);
log(T('youChoose')+tx(h,'t')+(LANG==='en'?' (playing ':'（打出')+cardName(h.card)+(LANG==='en'?')':'）'));
applyFx(h.fx||{});
if(h.npc)for(const k in h.npc){S.npc[k]=clamp(S.npc[k]+h.npc[k],0,100);}
if(h.log)log(h.log,'good');
checkZero();
setTimeout(()=>nextRound(),650);
renderStats();renderHand();
}
/* ---- 归零判定 ---- */
function checkZero(){
S._roundShesi=S._roundShesi||0;
const before=effShesi();
if(S.jiu<=0){S.jiu=30;S.qing=clamp(S.qing-20,0,S.qingMax);S.boss=clamp(S.boss-15,0,100);S._roundShesi++;addShesi(1);log(LANG==='en'?'💀 <b>Blackout!</b> You face-plant for ten minutes and wake up to three new selfies on your phone. Social death +1, boss favor −15.':'💀 <b>断片！</b>你趴在桌上睡了十分钟，醒来发现手机里多了三张自拍。社死+1，老板好感-15。','bad');sfx.bad();}
if(S.qing<=0){
if(S.washShield){S.washShield=false;S.qing=10;log(LANG==='en'?"🎭 The self-roast lingers: you hold it together. Composure back to 10.":'🎭 自黑的后劲：你强撑着没说错话，清醒回到 10。','gold');}
else{const v=pick(NPCS);S.npc[v.id]=clamp(S.npc[v.id]-15,0,100);S.qing=20;S._roundShesi++;addShesi(1);log('💀 <b>'+(LANG==='en'?'Foot in mouth!':'说错话！')+'</b>'+(LANG==='en'?' You publicly critique '+npcName(v.id)+'\'s haircut. '+npcName(v.id)+' favor −15. Social death +1.':'你当众评价了'+v.name+'的发型，'+v.name+'好感-15。社死+1。'),'bad');sfx.bad();}
}
}
/* ============ 渲染 ============ */
function statBar(label,emoji,val,max,color){
return '<div class="stat"><div class="row"><span>'+emoji+' '+label+'</span><span>'+val+' / '+max+'</span></div><div class="bar"><i style="width:'+clamp(val/max*100,0,100)+'%;background:'+color+'"></i></div></div>';
}
function renderStats(){
$('stats').innerHTML=
statBar(T('statJiu'),'🍺',S.jiu,S.jiuMax,'#e8b34b')+
statBar(T('statQing'),'☕',S.qing,S.qingMax,'#5aa9e6')+
statBar(T('statBoss'),'👔',S.boss,100,'#e05c8a')+
statBar(T('statRen'),'🤝',S.ren,150,'#5fd08a');
if(S.jiu<30)$('stats').innerHTML+='<div class="statwarn">'+T('warnJiu')+'</div>';
if(S.qing<30&&!S.washShield)$('stats').innerHTML+='<div class="statwarn">'+T('warnQing')+'</div>';
$('roundLab').textContent=tf('roundFmt',{r:S.round})+(effShesi()>0?' · 💀×'+effShesi():'');
$('posLab').textContent=posName(S.posIdx)+' · '+tx(PERSONAS[S.persona],'name');
$('teaLab').textContent=(LANG==='en'?'🍸×':'🍵×')+S.tea;
renderWash();
renderNet();
}
/* ---- 自黑解围（一次性洗白） ---- */
function renderWash(){
const el=$('washRow');if(!el)return;
if(!S.washUsed&&effShesi()>0){
const ok=S.qing>=60;
el.innerHTML='<button class="btn" id="btnWash" '+(ok?'':'disabled')+' style="border:2px solid var(--gold)">'+T('washBtn')+'<span class="fx">'+T('washFx')+(ok?'':tf('washNeed',{q:S.qing}))+'</span></button>';
const b=$('btnWash');if(b)b.onclick=doWash;
}else el.innerHTML='';
}
function doWash(){
if(!S||S.washUsed||effShesi()<=0||S.qing<60)return;
sfx.good();S.washUsed=true;S.washShield=true;S.qing=0;
S.shesiRaw=Math.max(0,S.shesiRaw-(S.persona==='yinXing'?0.5:1));
S._roundShesi=Math.max(0,(S._roundShesi||0)-1);
log(LANG==='en'?'🎭 <b>Self-roast save!</b> You turn your most embarrassing story into a bit. The room roars. Composure drained, social death −1 (once per game).':'🎭 <b>自黑解围！</b>你当众把黑历史讲成了段子，全场笑翻。清醒清空，社死-1（本局仅一次）。','gold');
renderStats();
}
function renderNet(){
const svg=$('npcnet');const cx=200,cy=120,R=88;let h='';
const pos=NPCS.map((n,i)=>{const a=-Math.PI/2+i*Math.PI*2/NPCS.length;return {n,x:cx+R*Math.cos(a),y:cy+R*Math.sin(a)};});
pos.forEach(p=>{const v=S.npc[p.n.id];const col=v>=60?'#5fd08a':v>=40?'#e8b34b':'#e05c5c';
h+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p.x+'" y2="'+p.y+'" stroke="'+col+'" stroke-width="'+(1+v/40)+'" opacity=".7"/>';
});
h+='<circle cx="'+cx+'" cy="'+cy+'" r="20" fill="#2a2f3b" stroke="#e8b34b"/><text x="'+cx+'" y="'+(cy+6)+'" text-anchor="middle" font-size="16">🧑</text><text x="'+cx+'" y="'+(cy+36)+'" text-anchor="middle" font-size="10" fill="#9aa0ae">'+T('you')+'</text>';
pos.forEach(p=>{const v=S.npc[p.n.id];const col=v>=60?'#5fd08a':v>=40?'#e8b34b':'#e05c5c';
h+='<circle cx="'+p.x+'" cy="'+p.y+'" r="17" fill="#262b38" stroke="'+col+'" stroke-width="2"/><text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" font-size="15">'+p.n.emoji+'</text><text x="'+p.x+'" y="'+(p.y+30)+'" text-anchor="middle" font-size="9" fill="#cfd4de">'+tx(p.n,'name')+v+'</text>';});
svg.innerHTML=h;
}
document.querySelector('.secttl').onclick=()=>{const c=$('netCard');c.style.display=c.style.display==='none'?'block':'none';};
function renderEvent(ev){
$('evTitle').textContent=tx(ev,'name');
$('evTags').innerHTML='<span class="tag">'+tx(ev,'tag')+'</span>'+(ev.rare?'<span class="tag" style="color:var(--gold);border:1px solid var(--gold)">'+T('tagRare')+'</span>':'')+(ev.type==='toast'?'<span class="tag">'+T('tagDodge')+'</span>':'');
$('evDesc').textContent=tx(ev,'desc');
let optsHtml=ev.opts.map((o,i)=>{
let label=tx(o,'t');
if(o.tea)label=(LANG==='en'?'🍸 '+T('mocktailOpt')+' ('+S.tea+' left)':'🍵 以茶代酒（剩余'+S.tea+'杯）');
const dis=o.tea&&S.tea<=0;
const fx=fmtFx(o.fx||{});
return '<button class="btn" data-i="'+i+'" '+(dis?'disabled':'')+'>'+label+(fx?'<span class="fx">'+fx+'</span>':'')+(dis?'<span class="fx">'+T('noTea')+'</span>':'')+'</button>';
}).join('');
const hx=hiddenOptFor(ev);
if(hx){
const npcFx=hx.npc?' · '+Object.keys(hx.npc).map(k=>npcName(k)+'+'+hx.npc[k]).join(' '):'';
optsHtml+='<button class="btn" data-hx="1" style="border:2px solid var(--gold)">🃏 '+tx(hx,'t')+'<span class="fx">'+tx(hx,'sub')+' · '+fmtFx(hx.fx||{})+npcFx+'</span></button>';
if(!S.hxToastShown){S.hxToastShown=true;setTimeout(()=>toast(tf('hxToast',{card:cardName(hx.card)})),400);}
}
$('evOpts').innerHTML=optsHtml;
document.querySelectorAll('#evOpts .btn').forEach(b=>b.onclick=()=>{if(b.dataset.hx)chooseHidden();else chooseOpt(+b.dataset.i);});
}
function renderHand(){
$('handHint').textContent=tf('handHint',{n:S.played});
$('hand').innerHTML=S.hand.length?S.hand.map((c,i)=>'<div class="pcard" data-i="'+i+'"><div class="nm">'+tx(c,'nm')+'</div><div class="cost">'+(LANG==='en'?'Composure ':'耗清醒 ')+c.cost+'</div><div>'+tx(c,'desc')+'</div>'+comboBadge(c)+'</div>').join(''):'<div class="muted" style="padding:8px">'+T('handEmpty')+'</div>';
document.querySelectorAll('#hand .pcard').forEach(el=>el.onclick=()=>playCard(+el.dataset.i));
}
function renderAll(ev){renderStats();renderEvent(ev||currentEvent());renderHand();}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800);}

/* ============ 结算 ============ */
const RATING_C={ '透明人':{name:'透明人',name_en:'Wallflower',e:'👻',c:1.0,txt:'全程低调，滴酒不漏地活到了散场。没人记得你来过——这何尝不是一种成功。',txt_en:'You kept it low-key and survived to the last song, drink by drink. Nobody remembers you were there — which is its own kind of victory.'},
'气氛组':{name:'气氛组',name_en:'Life of the Party',e:'🎉',c:1.2,txt:'你就是酒桌的气氛担当！合影里有你，拼酒里有你，八卦中心也有你。',txt_en:'You ARE the party energy! In every group photo, every toast, every gossip circle.'},
'老板心腹':{name:'老板心腹',name_en:"Boss's Favorite",e:'👑',c:1.5,txt:'陈总看你的眼神都不一样了。明年的晋升名单上，第一个就是你。',txt_en:"Mr. Carter looks at you differently now. First name on next year's promotion list: yours."},
'社死现场':{name:'社死现场',name_en:'Party Foul',e:'💀',c:0.5,txt:'你贡献了今晚所有的名场面。明早的公司大群，会有你的传说。',txt_en:"You supplied all of tonight's legendary moments. Tomorrow morning's company chat will tell your tale."}};
function ratingName(r){return tx(RATING_C[r],'name')||r;}
function ratingTxt(r){return tx(RATING_C[r],'txt');}
function endGame(){
S.over=true;
const se=effShesi();let rating;
if(se>=2)rating='社死现场';
else if(S.boss>=90&&se===0)rating='老板心腹';
else if(S.ren>=75&&se<=1)rating='气氛组';
else rating='透明人';
const posC=POSITIONS[S.posIdx].coeff, rc=RATING_C[rating].c;
const bonus=Math.max(0,Math.round((5000+S.boss*50+S.ren*30-se*2000+S.hb)*posC*rc));
const best=store.get('best',0);if(bonus>best)store.set('best',bonus);
// 职位晋升（只升不降）
const newPos=Math.max(S.posIdx,Math.min(3,RATING_IDX[rating]));store.set('pos',newPos);
// 成就
const ach=store.get('ach',[]);
const unlock=(id,nm)=>{if(ach.indexOf(id)<0){ach.push(id);log(T('achUnlock')+nm,'gold');return nm;}return null;};
const got=[];
if(se===0)got.push(unlock('a1',T('achA1')));
if(NPCS.every(n=>S.npc[n.id]>=60))got.push(unlock('a2',T('achA2')));
if(S.lietou&&se===0)got.push(unlock('a3',T('achA3')));
store.set('ach',ach);
S._end={rating,bonus,best,newPos,se,got,ach:ach.slice(),oldPos:S.posIdx};
show('scr-end');
renderEndScreen();
sfx[rating==='社死现场'?'bad':'good']();
}
function renderEndScreen(){
if(!S||!S._end)return;
const e=S._end;
const achNames={'a1':T('achA1'),'a2':T('achA2'),'a3':T('achA3')};
$('endEmoji').textContent=RATING_C[e.rating].e;
$('endRating').textContent=ratingName(e.rating);
$('endComment').textContent=ratingTxt(e.rating);
const money=LANG==='en'?'$':'¥';
$('endStats').innerHTML=
kv(T('kvBonus'),money+e.bonus+(e.bonus>=e.best&&e.bonus>0?T('kvNewRec'):''))+
kv(T('kvPos'),T('kvNextPos')+posName(e.newPos)+(e.newPos>e.oldPos?T('kvPromoted'):''))+
kv(T('kvJQ'),S.jiu+' / '+S.qing)+kv(T('kvBR'),S.boss+' / '+S.ren)+
kv(T('kvShesi'),e.se+T('kvShesiUnit'))+kv(T('kvHb'),money+S.hb);
$('endAch').innerHTML=(e.got.filter(Boolean).length?e.got.filter(Boolean).map(g=>'<div class="achline">🏅 '+g+'</div>').join(''):'<div class="muted">'+T('noAch')+'</div>')
+'<div class="muted" style="margin-top:6px">'+T('achTotal')+(e.ach.map(a=>achNames[a]).filter(Boolean).join(LANG==='en'?', ':'、')||T('achNone'))+'</div>';
}
function kv(k,v){return '<div class="kv"><span class="muted">'+k+'</span><span>'+v+'</span></div>';}
$('btnAgain').onclick=()=>{sfx.click();S=newState(selPersona);show('scr-prep');renderPrep();};
$('btnHome').onclick=()=>{sfx.click();show('scr-start');renderPersona();};

/* ============ 语言切换 ============ */
function applyStatic(){
document.title=T('title');
document.documentElement.lang=LANG==='en'?'en':'zh-CN';
document.querySelectorAll('[data-t]').forEach(el=>{el.innerHTML=T(el.dataset.t);});
$('howtoCard').innerHTML=T('howto');
$('muteBtn').title=T('muteTitle');
const lt=T('langToggle');
if($('langBtnHome'))$('langBtnHome').textContent=lt;
if($('langBtnTop'))$('langBtnTop').textContent=lt;
}
function setLang(l){
if(l!==undefined)LANG=l;else LANG=LANG==='en'?'zh':'en';
store.set('nh_lang',LANG);
applyStatic();
if($('scr-start').classList.contains('on'))renderPersona();
else if($('scr-prep').classList.contains('on')&&S)renderPrep();
else if($('scr-game').classList.contains('on')&&S)renderAll(currentEvent());
else if($('scr-end').classList.contains('on'))renderEndScreen();
}
/* init */
$('langBtnHome').onclick=()=>{sfx.click();setLang();};
$('langBtnTop').onclick=()=>{sfx.click();setLang();};
applyStatic();
renderPersona();
</script>
</body>
</html>
