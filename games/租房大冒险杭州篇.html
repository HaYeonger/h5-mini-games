<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>租房大冒险·纽约篇 | Rent Adventure: New York</title>
<style>
:root{
  --bg:#141210; --card:#1f1b15; --card2:#282219; --line:#3b3325;
  --txt:#ece5d8; --mut:#a89c86; --acc:#f0a832; --acc2:#e4572e;
  --good:#7bc96f; --bad:#ef6461; --blue:#6fb3d8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;line-height:1.6}
#app{max-width:540px;margin:0 auto;min-height:100vh;position:relative}
.screen{display:none;padding:12px 14px 60px;animation:fade .25s}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
h1{font-size:30px;margin:6px 0;letter-spacing:2px}
h2{font-size:19px;margin:14px 0 8px;color:var(--acc)}
h3{font-size:16px;margin:10px 0 6px}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.card.sel{border-color:var(--acc)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--mut);margin:2px 4px 2px 0}
.tag.hot{color:var(--acc);border-color:var(--acc)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.good{color:var(--good);border-color:var(--good)}
.ap-group{margin:6px 0 12px}
.ap-group-h{font-size:14px;font-weight:700;margin:10px 0 4px}
.howrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px dashed var(--line)}
.howrow:last-child{border-bottom:none}
.howic{font-size:22px;flex:none;width:30px;text-align:center}
.wl{padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.wl.win{background:rgba(123,201,111,.1);border:1px solid var(--good)}
.wl.lose{background:rgba(239,100,97,.08);border:1px solid var(--bad)}
details.card summary{cursor:pointer;font-weight:700;color:var(--acc);font-size:15px;list-style:none}
details.card summary::-webkit-details-marker{display:none}
details.card summary:before{content:"▶ ";font-size:12px}
details.card[open] summary:before{content:"▼ ";font-size:12px}
#tut-bubble{position:fixed;z-index:999;background:var(--card2);border:2px solid var(--acc);border-radius:12px;padding:12px 14px;max-width:80vw;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.55)}
.tut-hl{outline:2px solid var(--acc)!important;outline-offset:3px;border-radius:8px}
.btn{display:block;width:100%;padding:13px;margin:8px 0;background:var(--acc);color:#1a1408;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:400}
.btn.small{padding:9px;font-size:14px}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn:disabled{background:#3a352c;color:#7a7263;cursor:not-allowed}
.btnrow{display:flex;gap:8px}.btnrow .btn{margin:4px 0}
.statusbar{position:sticky;top:0;z-index:20;background:#191510;border-bottom:1px solid var(--line);padding:8px 14px;display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.statusbar b{color:var(--acc)}
.dialog{background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.dialog .who{color:var(--acc);font-weight:700;margin-bottom:4px}
.log{background:#171310;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:220px;overflow-y:auto;font-size:13px}
.log div{padding:4px 0;border-bottom:1px dashed #2c2619}
.log div:last-child{border:none}
.chip{display:inline-block;background:#2c2619;border:1px solid var(--line);border-radius:8px;padding:4px 10px;margin:3px;font-size:13px}
.chip.pit{border-color:var(--bad);color:#f0a49e}
.bar{height:10px;background:#2c2619;border-radius:6px;overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;background:var(--acc);border-radius:6px;transition:width .3s}
.bar.happy i{background:var(--good)}
.bar.health i{background:var(--blue)}
.bar.desire i{background:var(--acc2)}
.kv{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.kv span:last-child{color:var(--acc);font-weight:700}
#planCanvas{width:100%;border-radius:12px;border:1px solid var(--line);background:#1a1611;touch-action:manipulation}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2c2619;border:1px solid var(--acc);color:var(--acc);padding:10px 18px;border-radius:24px;font-size:14px;z-index:99;display:none;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.modal .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pitcard{background:#241d15;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:13px}
.pitcard.lock{opacity:.45;filter:grayscale(1)}
.center{text-align:center}
.big{font-size:42px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:20px}
.tactic{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:var(--card)}
.tactic.used{opacity:.4}
.tactic b{color:var(--acc)}
</style>
</head>
<body>
<div id="app">

<!-- 启动屏 -->
<div class="screen" id="scr-start"><div id="home-inner"></div></div>

<!-- 找房：房源列表 -->
<div class="screen" id="scr-browse">
  <div class="statusbar" id="sb-browse"></div>
  <h2 id="browse-title">🏘️ 今日房源 <span class="sub" id="browse-hint"></span></h2>
  <div id="listing-list"></div>
  <div class="btnrow">
    <button class="btn ghost small" id="btn-refresh" onclick="refreshListings()">🔄 换一批房源（-1天）</button>
    <button class="btn ghost small" id="btn-diary1" onclick="openDiary()">📓 租房日记</button>
  </div>
</div>

<!-- 看房探案 -->
<div class="screen" id="scr-inspect">
  <div class="statusbar" id="sb-inspect"></div>
  <h2 id="insp-title">🔍 看房探案</h2>
  <p class="sub" id="insp-info"></p>
  <canvas id="planCanvas" width="720" height="560"></canvas>
  <p class="sub center" id="insp-hint">点击房间进行检查 · 剩余 <b id="insp-left" style="color:var(--acc)"></b> 次</p>
  <h3 id="clue-h">🕵️ 发现的线索 <span class="sub" id="clue-count"></span></h3>
  <div class="log" id="clue-log" style="max-height:260px"><div class="sub" id="clue-empty">还没有检查任何房间…</div></div>
  <h3 id="suspect-h">⚠️ 疑似坑位</h3>
  <div id="pit-chips"><span class="sub">暂未发现</span></div>
  <div class="btnrow">
    <button class="btn grow" id="btn-to-neg" onclick="toNegotiate()" disabled></button>
    <button class="btn ghost grow" id="btn-runaway" onclick="runAway()"></button>
  </div>
</div>

<!-- 谈判 -->
<div class="screen" id="scr-neg">
  <div class="statusbar" id="sb-neg"></div>
  <h2 id="neg-title">💬 谈判</h2>
  <div class="dialog" id="neg-dialog"></div>
  <div class="card">
    <h3 id="neg-rent-h">💰 当前租金 <span id="neg-rent" style="color:var(--acc);font-size:22px"></span> <span class="sub" id="neg-permo">/月</span></h3>
    <div class="kv"><span id="neg-base-l">原始报价</span><span id="neg-base"></span></div>
    <div class="kv"><span id="neg-cut-l">已砍下</span><span id="neg-cut" style="color:var(--good)"></span></div>
  </div>
  <h3 id="tactic-h">🎯 谈判话术</h3>
  <div id="tactic-list"></div>
  <h3 id="repair-h">🔧 坑位筹码 <span class="sub">每个已发现的坑可要求维修（或自动折价150/个）</span></h3>
  <div id="repair-list"></div>
  <button class="btn" id="btn-sign" onclick="doSign()">✍️ 签约（首月+押金+中介费）</button>
  <p class="sub center" id="sign-note"></p>
  <button class="btn danger" id="btn-bail" onclick="runAway()">🏃 算了，跑路（-1天）</button>
</div>

<!-- 经营期 -->
<div class="screen" id="scr-manage">
  <div class="statusbar" id="sb-manage"></div>
  <h2 id="mg-h2">🗓️ 经营期 · <span id="mg-month"></span> <span class="sub" id="mg-sub"></span></h2>
  <div class="card">
    <div class="kv"><span id="mg-funds-l">💰 存款（首付进度）</span><span id="mg-funds"></span></div>
    <div class="bar"><i id="mg-fundbar"></i></div>
    <div class="sub" id="mg-target-note" style="margin:-4px 0 6px"></div>
    <div class="kv"><span id="mg-happy-l">😊 幸福度 <span class="sub">≥80 易涨薪</span></span><span id="mg-happy"></span></div>
    <div class="bar happy"><i id="mg-happybar"></i></div>
    <div class="kv"><span id="mg-health-l">❤️ 健康 <span class="sub">&lt;30 重感冒</span></span><span id="mg-health"></span></div>
    <div class="bar health"><i id="mg-healthbar"></i></div>
    <div class="kv"><span id="mg-salary-l">月薪</span><span id="mg-salary"></span></div>
    <div class="kv"><span id="mg-rent-l">月租</span><span id="mg-rent"></span></div>
    <div class="kv"><span id="mg-roomie-l">室友</span><span id="mg-roomie"></span></div>
  </div>
  <h3 id="ap-title">📋 这个月做 <span id="ap-total">3</span> 件事 <span class="sub">剩余 <b id="ap-left" style="color:var(--acc)">3</b> 次</span></h3>
  <div class="sub" id="ap-done-hint" style="display:none;color:var(--good)"></div>
  <div class="ap-group">
    <div class="ap-group-h" id="ap-group-rep-h">🔁 每月可做 <span class="tag hot">每月刷新</span></div>
    <div class="grid2" id="ap-grid-rep"></div>
    <div class="btnrow">
      <button class="btn ghost grow" id="btn-furnish" onclick="openFurnish()">🛋️ 布置小家 <span class="sub">不花行动点</span></button>
    </div>
  </div>
  <div class="ap-group">
    <div class="ap-group-h" id="ap-group-once-h">🎯 一次性大事 <span class="tag">一生一次</span></div>
    <div class="grid2" id="ap-grid-once"></div>
    <div class="btnrow">
      <button class="btn ghost grow" id="btn-roomie" onclick="roomieBtn()">🧑‍🤝‍🧑 招室友（首年房租减半）</button>
    </div>
  </div>
  <div class="btnrow">
    <button class="btn grow" id="btn-nextmonth" onclick="nextMonth()">⏭️ 结束本月 →</button>
  </div>
  <div class="btnrow">
    <button class="btn ghost grow" id="btn-diary2" onclick="openDiary()">📓 租房日记</button>
  </div>
  <h3>📜 月报</h3>
  <div class="log" id="mg-log" style="max-height:300px"></div>
</div>

<!-- 结局 -->
<div class="screen" id="scr-end">
  <div class="center" style="padding-top:24px">
    <div class="big" id="end-emoji">🏆</div>
    <h1 id="end-title"></h1>
    <p class="sub" id="end-sub"></p>
  </div>
  <div class="card" id="end-stats"></div>
  <div class="card"><h3 id="end-diary-h">📓 漂泊小结</h3><div class="log" id="end-diary" style="max-height:200px"></div></div>
  <button class="btn" id="btn-again" onclick="newRun()">🔄 再漂一次</button>
  <button class="btn ghost" id="btn-home" onclick="renderHome();show('scr-start')">回主菜单</button>
</div>

</div>

<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
"use strict";
/* ================= 工具 ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let R = mulberry32(((Date.now()%2147483647)^0x9e37)>>>0);
function ri(a,b){return a+Math.floor(R()*(b-a+1))}
function pick(arr){return arr[Math.floor(R()*arr.length)]}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(n){return (n<0?"-":"")+Math.abs(Math.round(n)).toString().replace(/\B(?=(\d{3})+(?!\d))/g,",")}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
/* ================= i18n ================= */
let LANG='en';
try{const v=localStorage.getItem('zf_lang');if(v==='zh'||v==='en')LANG=v;
else{const n=(navigator.language||'en').toLowerCase();LANG=n.indexOf('zh')===0?'zh':'en';}}catch(e){LANG='en';}
const tx=(zh,en)=>LANG==='en'?en:zh;
function money(n){return LANG==='en'?"$"+fmt(n):fmt(n)+"元"}
function setLang(l){LANG=(l==='zh')?'zh':'en';try{localStorage.setItem('zf_lang',LANG)}catch(e){}renderLang();}
function toggleLang(){setLang(LANG==='zh'?'en':'zh')}
function langBtn(){return `<button class="btn ghost small" style="margin-left:6px" onclick="toggleLang()">${LANG==='zh'?'EN':'中文'}</button>`}
function renderLang(){
  renderHome();
  if(!S){return;}
  statusBar();
  const ph=S.phase;
  if(ph==="browse")renderBrowse();
  else if(ph==="inspect")renderInspect();
  else if(ph==="neg")renderNeg();
  else if(ph==="manage")renderManage();
}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(e._t);e._t=setTimeout(()=>e.style.display="none",2200)}
function show(id){document.querySelectorAll(".screen").forEach(e=>e.classList.remove("on"));$(id).classList.add("on");window.scrollTo(0,0)}
function openModal(html){$("modal-box").innerHTML=html+'<button class="btn ghost" style="margin-top:10px" onclick="closeModal()">'+tx("关闭","Close")+'</button>';$("modal").classList.add("on")}
function closeModal(){$("modal").classList.remove("on")}
$("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ================= 区域 ================= */
const DISTRICTS=[
 {name:"曼哈顿",en:"Manhattan",rent:[3500,5000],commute:[20,40],metro:"4/5/6线",metro_en:"4/5/6",flavor:"金融科技宇宙中心，灯火通明的加班圣地",flavor_en:"The center of the universe — finance & tech, lights never go out"},
 {name:"布鲁克林",en:"Brooklyn",rent:[3000,4500],commute:[25,50],metro:"L线",metro_en:"L",flavor:"褐石街区配天际线，风景这边独好，钱包瑟瑟发抖",flavor_en:"Brownstones with skyline views — gorgeous, and your wallet feels it"},
 {name:"皇后区",en:"Queens",rent:[2500,3800],commute:[25,45],metro:"7号线",metro_en:"7",flavor:"老街区的烟火气，美食无敌",flavor_en:"Old-neighborhood soul, unbeatable food scene"},
 {name:"布朗克斯",en:"Bronx",rent:[2500,3800],commute:[30,50],metro:"4号线",metro_en:"4",flavor:"街头文化正崛起，价格洼地",flavor_en:"Street culture on the rise — a value pocket"},
 {name:"斯塔滕岛",en:"Staten Island",rent:[2000,3200],commute:[35,60],metro:"轮渡线",metro_en:"Ferry",flavor:"免费轮渡在侧，性价比之王",flavor_en:"Free ferry next door — king of value"},
 {name:"新泽西",en:"New Jersey",rent:[1500,2600],commute:[60,95],metro:"PATH线",metro_en:"PATH",flavor:"价格美丽，就是通勤像取经",flavor_en:"Beautiful prices — but the commute is a pilgrimage"},
];
/* 老存档兼容：旧杭州区名 → 新纽约区名（仅展示层映射，存档数据不动） */
const LEGACY_D={"滨江":"曼哈顿","西湖区":"布鲁克林","上城":"皇后区","拱墅":"布朗克斯","萧山":"斯塔滕岛","余杭":"新泽西"};
function dName(d){if(!d)return "";const zh=typeof d==="string"?(LEGACY_D[d]||d):(LEGACY_D[d.name]||d.name);if(LANG==='en'){const f=DISTRICTS.find(x=>x.name===zh);return f?f.en:zh;}return zh;}
function dMetro(d){if(!d)return "";const m=typeof d==="string"?d:(d.metro||"");const zh=typeof d==="string"?(LEGACY_D[d]||d):(LEGACY_D[d.name]||d.name);const f=DISTRICTS.find(x=>x.name===zh);if(f)return LANG==='en'?f.metro_en:f.metro;const f2=DISTRICTS.find(x=>x.metro===m);if(f2)return LANG==='en'?f2.metro_en:f2.metro;return m;}
function aptDName(apt){return dName(apt.dname);}
function aptMetro(apt){const dn=apt.dname;let m=apt.metro;if(LEGACY_D[dn]){const f=DISTRICTS.find(x=>x.name===LEGACY_D[dn]);if(f)m=f.metro;}if(LANG==='en'){const f2=DISTRICTS.find(x=>x.metro===m);return f2?f2.metro_en:m;}return m;}
function dFlavor(d){return LANG==='en'?d.flavor_en:d.flavor;}
const LAYOUT_EN={"一居室":"1BR","两居室":"2BR","三居室(合租)":"3BR shared"};
function layoutName(l){return LANG==='en'?(LAYOUT_EN[l]||l):l;}
const ROOM_EN={"卧室":"Bedroom","卫生间":"Bathroom","客厅":"Living Rm","厨房":"Kitchen","玄关":"Entry","阳台":"Balcony"};
function roomName(r){return LANG==='en'?(ROOM_EN[r]||r):r;}
function pitName(p){const n=(typeof p==="string")?p:p.n;if(LANG==='en'&&PIT_EN[n])return PIT_EN[n].n;return n;}
function pitField(p,f){const n=(typeof p==="string")?p:p.n;if(LANG==='en'&&PIT_EN[n]&&PIT_EN[n][f])return PIT_EN[n][f];return (typeof p==="string")?p:p[f];}
function ldName(ld){return LANG==='en'?(ld.name_en||ld.name):ld.name;}
function ldDesc(ld){const d=ldF(ld,"desc");if(LANG==='en'){const i=d.indexOf(". ");return (i>0?d.slice(0,i):d)+".";}const i=d.indexOf("。");return (i>0?d.slice(0,i):d)+"。";}
function ldF(ld,f){return LANG==='en'?(ld[f+"_en"]||ld[f]):ld[f];}
const LAYOUTS=["一居室","一居室","两居室","两居室","三居室(合租)"];

/* ================= 50种坑 =================
   n:名 r:房间 t:房东话术(陷阱) c:检查发现的线索 e:爆发后果 m:月罚金 h:幸福惩罚 s:特殊 */
const PITS=[
{n:"窗外是墙",r:"卧室",t:"采光特别好，白天不用开灯！",c:"卧室窗外30cm就是邻楼外墙。所谓的采光好，指的是——邻居家的灯很亮。",e:"阴暗的卧室让你越住越丧。",m:0,h:10},
{n:"二房东",r:"玄关",t:"房东直租，没有中间商赚差价！",c:"鞋柜里翻出两份合同，落款名字根本对不上。",e:"合同存疑，住得心慌。每月有小概率卷款跑路。",m:0,h:5,s:"runaway"},
{n:"楼上轰趴",r:"客厅",t:"楼上住的都是安静上班族。",c:"天花板有被低音炮震出的裂纹，隐约还能感受到上周的蹦迪余震。",e:"每周五深夜，楼上准时开蹦。",m:0,h:8},

/* ===== 2.0平衡补丁（2026-10-17，bot 10局数据驱动）：新局压缩随机金额区间以降低种子方差、

function balV(){return (S&&S._balV)||1}
function evAmt(oldV,newV){return balV()>=2?newV:oldV} // 固定金额：老值/新值
function evRi(a,b,c,d){return balV()>=2?ri(c,d):ri(a,b)} // 随机区间：老[a,b]/新[c,d]
function gigCoef(){return balV()>=2?1.25:1} // 副业回调：新局恢复被×0.8砍掉的20%（1/0.8=1.25）

}

function genListings(){
  S.listings=[];
  for(let i=0;i<3;i++){
    const d=pick(DISTRICTS);
    const creditMod=1-(S.credit-50)/400; // 信用50→1.0, 100→0.875
    const rent=Math.round(ri(d.rent[0],d.rent[1])*Math.max(0.85,Math.min(1.15,creditMod))/50)*50;
    const commute=ri(d.commute[0],d.commute[1]);
    const landlord=pick(LANDLORDS);
    let pitN=Math.max(1,Math.min(4,Math.round(1+R()*3-(S.credit-50)/40)));
    if(landlord.id==="zhongjie")pitN=Math.min(4,pitN+1);
    const pits=shuffle(PITS).slice(0,pitN).map(p=>Object.assign({},p,{r:pick(ROOMS)}));
    let fakePit=null;
    if(landlord.id==="xijing"){ // 戏精：编一个假坑
      const real=pits.map(p=>p.n);
      fakePit=pick(PITS.filter(p=>!real.includes(p.n)));
    }
    let lrent=rent;
    if(landlord.id==="shuaishou")lrent=Math.round(rent*0.9/50)*50;
    if(landlord.id==="erfangdong")lrent=Math.round(rent*0.75/50)*50;
    S.listings.push({d,layout:pick(LAYOUTS),rent:lrent,baseRent:lrent,commute,metro:d.metro,landlord,pits,fakePit,
      tagline:pick(TAGLINES)});
  }
}

/* ================= 看房探案 ================= */
const ROOMS=["卧室","卫生间","客厅","厨房","玄关","阳台"];
const ROOM_RECT={ // 720x560
  "卧室":[10,10,340,200],"卫生间":[360,10,350,200],
  "客厅":[10,220,440,180],"厨房":[460,220,250,180],
  "玄关":[10,410,220,140],"阳台":[240,410,470,140],
};
function startInspect(i){
  const L=S.listings[i];S.cur=i;S.inspLeft=6;S.clues=[];S.foundPits=[];S.fakeFound=false;
  S.rooms={};
  ROOMS.forEach(r=>S.rooms[r]={clues:[],revealed:0});
  L.pits.forEach(p=>S.rooms[p.r].clues.push({kind:"pit",pit:p}));
  if(L.fakePit){S.rooms[pick(ROOMS)].clues.push({kind:"fake",pit:L.fakePit})}
  ROOMS.forEach(r=>{const n=ri(1,2);for(let k=0;k<n;k++)S.rooms[r].clues.push({kind:"good",note:pick(GOOD_NOTES)})});
  if(L.landlord.id==="xijing")S.rooms[pick(ROOMS)].clues.push({kind:"good",note:pick(GOOD_NOTES)});
  ROOMS.forEach(r=>S.rooms[r].clues=shuffle(S.rooms[r].clues));
  addLandlordCodex(L.landlord.id);
  S.phase="inspect";save();renderInspect();show("scr-inspect");
}
function renderInspect(){
  statusBar();
  const L=S.listings[S.cur];
  $("insp-title").textContent=`🔍 ${tx("看房探案","Inspect")} · ${dName(L.d)} ${layoutName(L.layout)}`;
  $("insp-info").textContent=`${L.landlord.emoji}${ldName(L.landlord)}：${ldDesc(L.landlord)}  ${tx("租金","Rent")}${money(L.rent)}${tx("/月","/mo")} · ${tx("通勤","Commute")}${tx(" "," ")}${L.commute}${tx("分钟"," min")}`;
  $("insp-hint").innerHTML=`${tx("点击房间进行检查 · 剩余","Tap a room to inspect · ")}<b id="insp-left" style="color:var(--acc)"></b>${tx(" 次"," checks left")}`;
  $("insp-left").textContent=S.inspLeft;
  $("clue-h").innerHTML=`🕵️ ${tx("发现的线索","Clues found")} <span class="sub" id="clue-count"></span>`;
  $("clue-count").textContent=`(${S.clues.length}${tx("条","")})`;
  const ce=$("clue-empty");if(ce)ce.textContent=tx("还没有检查任何房间…","No rooms inspected yet…");
  $("suspect-h").textContent=`⚠️ ${tx("疑似坑位","Suspected traps")}`;
  $("btn-runaway").textContent=`🏃 ${tx("换一套（-1天）","Switch (-1 day)")}`;
  updateNegBtn();
  drawPlan();
}
function drawPlan(){
  const cv=$("planCanvas"),ctx=cv.getContext("2d");
  if(!ctx.roundRect){ctx.roundRect=function(x,y,w,h){this.beginPath();this.rect(x,y,w,h)}}
  ctx.clearRect(0,0,720,560);
  ctx.fillStyle="#1a1611";ctx.fillRect(0,0,720,560);
  ROOMS.forEach(r=>{
    const [x,y,w,h]=ROOM_RECT[r],st=S.rooms[r];
    const left=st.clues.length-st.revealed;
    ctx.fillStyle=st.revealed>0?"#2b2417":"#221d14";

  lines.push(`<b>${tx("—— 第","—— Month ")}${S.month}${tx("个月 ——"," ——")}</b>`);
  // 房价上涨：首付目标动态上调（仅新局，老存档冻结）
  if(S._dynTarget){S.target+=500;lines.push(tx(`📈 纽约房价又涨了，首付目标上调至${money(S.target)}`,`📈 NYC prices up again — target now ${money(S.target)}`))}
  // 工资
  S.funds+=S.salary;lines.push(tx(`💼 发工资 +${money(S.salary)}`,`💼 Payday +${money(S.salary)}`));
  // 房租
  let rentPay=A.rent-(S.subsidy>0?300:0);if(S.subsidy>0)S.subsidy--;
  let roomieNote="";
  if(S.roomie){const share=balV()>=2?(S.month>=13?0.6:0.5):0.5; // 新局：第二年起室友只分摊40%
    rentPay=Math.round(rentPay*share);
    roomieNote=share>0.5?tx("（室友分摊40%，第二年起AA更细了）","(roomie covers 40% — year 2 splits finer)"):"（室友分摊）";}
  S.funds-=rentPay;lines.push(tx(`🏠 交房租 -${money(rentPay)}${roomieNote}`,`🏠 Rent -${money(rentPay)}${roomieNote}`));
  // 生活开销：随年份上涨
  const living=S.month<12?1200:S.month<24?1500:1800;
  S.funds-=living;lines.push(tx(`🍚 生活开销 -${money(living)}（吃喝交通，一个子儿都省不下）`,`🍚 Living costs -${money(living)} (food, transit — every cent)`));
  // 家具月费
  S.furn.forEach(f=>{if(f.monthly){S.funds+=f.monthly;lines.push(`${furnName(f)} -${money(-f.monthly)}`)}});
  // 理财收益
  if(S.invest&&S.invest.mmf>0){const r=Math.round(S.invest.mmf*0.0016);S.invest.mmf+=r;if(r>0)lines.push(tx(`💰 货币基金收益 +${money(r)}`,`💰 Money fund interest +${money(r)}`))}
  if(S.invest&&S.invest.fund>0){
    const x=R();let ch,news;
    if(x<0.55){ch=evRi(3,8,4,6);news=pick([tx("大盘飘红，基金回血","Market up, fund recovers"),tx("新能源支棱起来了","Green energy rallies")]);}
    else if(x<0.80){ch=-evRi(2,5,2,4);news=pick([tx("新能源又崩了","Green energy crashes"),tx("半导体绿得发慌","Semis in the red")]);}
    else{ch=0;news=tx("大盘横盘，基金装死","Market flat, fund plays dead");}
    const d=Math.round(S.invest.fund*ch/100);S.invest.fund=Math.max(0,S.invest.fund+d);
    lines.push(`📈 ${tx("基金","Fund")}${ch>0?"+":""}${ch}%（${news}）${d>=0?"+":""}${money(d)}`);
  }
  // 试用期
  if(S.probation){S.probation=false;if(R()<0.5){S.happy=Math.max(0,S.happy-8);lines.push(tx("😰 跳槽试用期高压：幸福-8。","😰 New-job probation stress: happiness -8."))}else lines.push(tx("✨ 试用期顺利通过，站稳脚跟！","✨ Passed probation — you're established!"))}
  // 未发现的坑：固定月费类自动扣
  const AUTO={bill200:200,bill150:150,taxi400:400,car200:200};
  A.undiscovered.forEach(n=>{
    const p=pitByName(n);if(!p)return;
    if(AUTO[p.s]){S.funds-=AUTO[p.s];lines.push(`⚠️【${pitName(p)}】${pitField(p,"e")} -${AUTO[p.s]}`)}
    else if(p.s==="summer300"&&[6,7,8].includes(S.month%12||12)){S.funds-=300;lines.push(`⚠️【${pitName(p)}】${pitField(p,"e")} -300`)}
    else if(p.s==="winter400"&&[12,1,2].includes(S.month%12||12)){S.funds-=400;lines.push(`⚠️【${pitName(p)}】${pitField(p,"e")} -400`)}
    else if(p.m||p.h){if(R()<0.25){S.funds-=p.m;S.happy-=p.h;lines.push(`⚠️【${pitName(p)}】${pitField(p,"e")}${p.m?" -"+p.m:""}${p.h?tx(" 幸福-"," happiness-")+p.h:""}`)}}
  });
  // 幸福/健康自然衰减
  S.happy=Math.max(0,S.happy-2);
  S.health=Math.max(0,S.health-2);
  // 生病
  if(S.health<30&&!S.sickCd){S.sickCd=3;const fee=evRi(800,1500,1000,1300);S.funds-=fee;S.apNext=2;S._ganmao=true;lines.push(tx(`🤒 重感冒：医药费-${money(fee)}，下月行动点-1`,`🤒 Bad flu: medical -${money(fee)}, next month -1 action`))}
  if(S.sickCd>0)S.sickCd--;
  // 室友事件（新局额外加入2个"矛盾"事件，带真实代价）
  if(S.roomie&&R()<0.35){const pool=balV()>=2?ROOMIE_EVENTS:ROOMIE_EVENTS.filter(e=>!e.newOnly);const ev=pick(pool);lines.push("🧑‍🤝‍🧑 "+(LANG==="en"?ev.text_en:ev.text)+"<br>→ "+ev.run(S,S.roomie))}
  // 月度事件
  const pool=[];
  EVENTS.forEach(e=>{if(e.once&&S["done_"+e.id])return;if(e.cond&&!e.cond(S))return;pool.push({e,w:e.w>0?e.w:20})});
  if(pool.length){
    let tot=pool.reduce((a,b)=>a+b.w,0),r=R()*tot,chosen=pool[0].e;
    for(const p of pool){r-=p.w;if(r<=0){chosen=p.e;break}}
    if(chosen.once)S["done_"+chosen.id]=1;
    lines.push((LANG==="en"?chosen.text_en:chosen.text)+"<br>→ "+chosen.run(S));
  }
  // 涨薪/降薪
  let raiseRate=0.3;
  if(S._renqing){raiseRate=0.6;S._renqing=false;lines.push(tx("🤝 人情到位：这次涨薪稳了！","🤝 Favor paid off: this raise is locked!"))}
  if(S.happy>=80&&R()<raiseRate){const r=evAmt(650,400);S.salary+=r;lines.push(tx(`📈 幸福度爆棚，工作状态拉满！涨薪+${r}！`,`📈 On fire! Raise +${r}!`))}
  else if(S.happy<=30&&R()<0.25){const c=evAmt(500,300);S.salary=Math.max(3000,S.salary-c);S.happy-=5;lines.push(tx(`📉 幸福度过低，工作频频出错…月薪-${c}。`,`📉 Too unhappy, mistakes at work… salary -${c}.`))}
  S.happy=Math.max(0,Math.min(100,S.happy));
  S.health=Math.max(0,Math.min(100,S.health));
  addDiary(tx(`经营第${S.month}个月：存款${money(S.funds)}，幸福${S.happy}。`,`Month ${S.month}: savings ${money(S.funds)}, happiness ${S.happy}.`));
  // 二房东跑路 → 回到找房
  if(S.phase==="homeless"){
    const lossNote=lines.join("<br>");
    S.apt=null;S.roomie=null;S.month=0;S.phase="browse";S.day+=7;
    if(S.day>=30){save();return endGame("tianqiao")}
    genListings();save();renderBrowse();show("scr-browse");
    openModal(`<h2 class="center">${tx("🏃 被迫重新找房","🏃 Forced to re-hunt")}</h2><p>${lossNote}</p><p>${tx("你抱着被子站在马路上。还剩","You're on the street with a blanket. ")} <b style="color:var(--acc)">${31-S.day}</b> ${tx("天，继续战斗吧。","days left. Keep fighting.")}</p>`);
    return;
  }
  if(S.funds<0){save();return endGame("broke")}
  if(S.funds>=(S.target||200000)){save();return endGame("shoufu_win")}
  S.month++;
  if(S.month>36){save();return endGame("final")}
  S.ap=S.apNext||3;S.apTotal=S.ap;S.apNext=3;
  refreshShop();
  mgLog(lines.join("<br>"));
  maybeStartArc();
  save();renderManage();checkAchv();
}

function refreshShop(){
  const owned=n=>S.furn.some(x=>x.n===n);
  const unowned=FURNITURE.filter(f=>!owned(f.n));
  let sel=unowned.length>=2?shuffle(unowned).slice(0,2):unowned.slice();
  const rest=shuffle(FURNITURE.filter(f=>sel.indexOf(f)<0)).slice(0,5-sel.length);
  S.shop=shuffle(sel.concat(rest));
}
function openFurnish(){
  if(!S.shop||!S.shop.length)refreshShop();
  let html=`<h2>🛋️ ${tx("布置小家","Decorate")}</h2><p class='sub'>${tx("每月上新5件（随机）。花钱提升幸福度，幸福度高更容易涨薪。","5 new items monthly (random). Spend for happiness — happier = easier raises.")}</p>`;
  S.shop.forEach((f,i)=>{
    const owned=S.furn.some(x=>x.n===f.n);
    html+=`<div class="tactic${owned?" used":""}"><b>${furnName(f)}</b> <span class="sub">${furnDesc(f)}</span><br>
    <span class="sub">${money(f.c)} · ${tx("幸福+","Happiness +")}${f.h}</span> ${owned?'<span class="tag good">'+tx("已拥有","Owned")+'</span>':`<button class="btn small" style="margin-top:6px" ${S.funds<f.c?"disabled":""} onclick="buyFurn(${i})">${tx("购买","Buy")}</button>`}</div>`;
  });
  openModal(html);
}
function buyFurn(i){
  const f=S.shop[i];if(!f)return;
  if(S.funds<f.c||S.furn.some(x=>x.n===f.n))return;
  S.funds-=f.c;S.happy=Math.min(100,S.happy+f.h);S.furn.push(f);
  mgLog(tx(`🛋️ 购入${furnName(f)}，幸福+${f.h}`,`🛋️ Bought ${furnName(f)}, happiness +${f.h}`));
  closeModal();save();renderManage();
}
function openDiary(){
  const items=S.diary.slice().reverse().map(d=>`<div>${esc(d)}</div>`).join("")||'<div class="sub">'+tx("还没有记录…","Nothing yet…")+'</div>';
  openModal(`<h2>📓 ${tx("租房日记","Rent diary")}</h2><div class="log" style="max-height:50vh">${items}</div>`);
}

  });

  let avHtml=ACHV.map(([id,n,d])=>`<div class="kv"><span>${a[id]?"✅":"🔒"} ${n}</span><span class="sub">${d}</span></div>`).join("");
  openModal(`<h2>📚 ${tx("图鉴","Codex")}（${c.pits.length}/50${tx("坑","traps")} · ${c.landlords.length}/6${tx("房东","landlords")}）</h2><h3>⚠️ ${tx("坑位图鉴","Trap codex")}</h3>${pitsHtml}<h3>🧑‍💼 ${tx("房东图鉴","Landlord codex")}</h3><div class="grid2">${ldHtml}</div><h3>🏆 ${tx("成就","Achievements")}</h3>${avHtml}`);

let html=`<h2>${arcName(a)}</h2><p>${txt}</p>`;
avail.forEach((c,i)=>{html+=`<button class="btn${i>0?" ghost":""}" onclick="arcChoice(${i})">${esc(arcCT(c))}</button>`});
openModal(html);
}
function arcChoice(i){
const A=S.arcs.active;if(!A)return;
const a=ARCS[A.id],st=a.steps[A.step];
const avail=st.choices.filter(c=>!c.req||c.req(S));
const c=avail[i];if(!c)return;
c.run(S);
mgLog(`📌 ${arcName(a)}：${arcLog(c)}`);
addDiary(`${arcName(a)}：${arcLog(c)}`);
A.step++;
if(A.step>=a.steps.length){S.arcs.done.push(A.id);S.arcs.active=null;S.arcs.tmp={};closeModal()}
else renderArc();
save();renderManage();
}
function maybeStartArc(){
if(!S.arcs)return;
if(S._ganmao){S._ganmao=false;startArc("ganmao");return}
if(S.arcs.active){renderArc();return}
if(!S.arcs.queue.length||R()>=0.55)return;
for(let k=0;k<S.arcs.queue.length;k++){
const id=S.arcs.queue[0],a=ARCS[id];
if(a.canStart&&!a.canStart(S)){S.arcs.queue.push(S.arcs.queue.shift());continue}
S.arcs.queue.shift();startArc(id);return;
}
}
