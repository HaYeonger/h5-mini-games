<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>凌晨四点的便利店</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#0d1017;color:#e9ecf3;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:15px;line-height:1.65}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:0 14px 40px;position:relative}
h1{font-size:26px;margin:0}
h2{font-size:19px;margin:0 0 8px}
.sub{color:#9aa3b5;font-size:13px}
.card{background:#171c28;border:1px solid #242c3f;border-radius:14px;padding:14px;margin:12px 0;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#topbar{position:sticky;top:0;z-index:50;background:rgba(13,16,23,.96);backdrop-filter:blur(6px);padding:10px 0 8px;border-bottom:1px solid #1f2635;margin:0 -14px;padding-left:14px;padding-right:14px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
.chip{background:#1d2333;border:1px solid #2b3450;border-radius:20px;padding:3px 10px;white-space:nowrap}
.chip b{color:#ffcf7d}
.barwrap{flex:1;min-width:90px}
.barlabel{font-size:11px;color:#9aa3b5;display:flex;justify-content:space-between}
.bar{height:8px;background:#262d42;border-radius:6px;overflow:hidden;margin-top:2px}
.bar>i{display:block;height:100%;border-radius:6px;transition:width .4s}
#sleepFill{background:linear-gradient(90deg,#7c6ff0,#b39dff)}
#stamFill{background:linear-gradient(90deg,#3ecf8e,#a7f3c7)}
.cust-head{display:flex;gap:12px;align-items:center}
.avatar{font-size:52px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
.cust-name{font-size:18px;font-weight:700}
.moodtag{font-size:12px;color:#ffcf7d;border:1px solid #4a3d22;background:#241d10;border-radius:12px;padding:1px 9px;margin-top:4px;display:inline-block}
.moodtag.good{color:#7fd6a4;border-color:#2f6b4a;background:#1d2f24}
.clue{background:#1f2637;border-left:3px solid #ffb347;border-radius:8px;padding:9px 11px;margin:8px 0;font-size:14px}
.steps{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.step{background:#232b3f;border:1px solid #33405c;border-radius:20px;padding:4px 12px;font-size:13px;color:#8b93a7}
.step.on{background:#2c4a35;border-color:#4caf7d;color:#7fd6a4;font-weight:700}
.step-arrow{color:#4a5468;font-size:12px}
.howrow{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.howic{font-size:22px;flex:0 0 auto;line-height:1.4}
.howrow b{font-size:15px}
.winline{background:#1d2f24;border:1px solid #3f5a3a;border-radius:10px;padding:10px 12px;margin:10px 0 6px;font-size:14px;color:#7fd6a4}
.loseline{background:#2f1d1d;border:1px solid #5a3a3a;border-radius:10px;padding:10px 12px;margin:0 0 4px;font-size:14px;color:#e89a9a}
.clue .ask{display:block;margin-top:7px;background:#2a1f3d;border:1px dashed #8b6fd8;border-radius:8px;padding:8px 10px;color:#d9c9ff;font-size:13px}
.kwbtn{display:inline-block;margin-left:6px;background:#3a2c12;color:#ffcf7d;border:1px solid #8a6a2a;border-radius:12px;padding:1px 10px;font-size:12px;cursor:pointer}
.kwbtn:disabled{opacity:.35;cursor:default}
.kwbtn.done{background:#233026;color:#7fd6a4;border-color:#2f6b4a}
button{font-family:inherit}
.resp{display:block;width:100%;text-align:left;background:#202941;border:1px solid #31405f;color:#e9ecf3;border-radius:12px;padding:12px;margin:9px 0;font-size:14.5px;cursor:pointer;line-height:1.6}
.resp:active{transform:scale(.985)}
.resp:disabled{opacity:.5}
.resp:hover{border-color:#ffb347}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.abtn{flex:1;min-width:120px;background:#2a3349;border:1px solid #3b4a6b;color:#e9ecf3;border-radius:12px;padding:11px;font-size:14px;cursor:pointer}
.abtn.primary{background:#ffb347;border-color:#ffb347;color:#23180a;font-weight:700}
.abtn:disabled{opacity:.4}
.abtn.small{flex:0 1 auto;min-width:0;padding:8px 12px;font-size:13px}
.dlg{background:#141926;border:1px solid #2a3350;border-radius:12px;padding:12px;margin:10px 0;font-size:14.5px}
.dlg .who{color:#ffcf7d;font-size:12px;margin-bottom:4px}
.shopitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#1a2132;border:1px solid #2b3550;border-radius:12px;padding:11px;margin:9px 0}
.shopitem .desc{font-size:13px;color:#aeb7cc}
.shopitem.bought{opacity:.55}
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.82);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.sheet{background:#171d2b;border:1px solid #2c3550;border-radius:16px;padding:18px;max-width:480px;width:100%;max-height:88dvh;overflow:auto}
.center{text-align:center}
.bigemoji{font-size:64px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.stat-grid .cell{background:#1c2334;border-radius:10px;padding:10px;text-align:center}
.stat-grid .cell b{font-size:20px;color:#ffcf7d;display:block}
.frag{background:#1d1526;border:1px solid #43305e;border-radius:10px;padding:9px 11px;margin:7px 0;font-size:13.5px;color:#d9c9ff}
.codex-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.codex-cell{background:#1a2133;border-radius:10px;padding:8px 4px;text-align:center;font-size:11px;color:#9aa3b5}
.codex-cell .e{font-size:26px;display:block}
.codex-cell.got{color:#e9ecf3;border:1px solid #3f5a3a}
.codex-cell.lock{filter:grayscale(1);opacity:.45}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#2c2113;border:1px solid #8a6a2a;color:#ffd98a;border-radius:12px;padding:10px 18px;z-index:200;font-size:14px;animation:fadein .3s;max-width:90vw;text-align:center}
#shelfArea{position:relative;height:340px;background:#141a28;border-radius:12px;overflow:hidden;touch-action:none;margin:10px 0}
.shelf-slot{position:absolute;bottom:8px;width:19%;height:74px;border:2px dashed #3b4a6b;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8b95ad;text-align:center}
.shelf-item{position:absolute;width:56px;height:56px;font-size:34px;display:flex;align-items:center;justify-content:center;background:#232c44;border-radius:12px;cursor:grab;user-select:none;touch-action:none;z-index:5}
.shelf-item.locked{opacity:.35;cursor:default}
.timer{font-size:13px;color:#ffcf7d}
.hidden{display:none!important}
.foot{color:#5c6579;font-size:11px;text-align:center;margin-top:26px}
a{color:#8fb7ff}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ============ 凌晨四点的便利店 · 单文件版 ============ */

/* ---------- 客人数据（12位手写） ---------- */
var CUSTOMERS=[
{id:"c1",name:"程序员小赵",emoji:"🧑‍💻",mood:70,
 intro:"凌晨，他抱着几罐啤酒走进来，手机屏幕还亮着。",
 clues:[
  {t:"他盯着手机，聊天框停在「我们分手吧」四个字上。",kw:"我们分手吧",ask:"三个月前他们还计划去大理。她说：你陪我的时间，还没有bug多。"},
  {t:"拿了六罐啤酒，又默默放回去两罐：「一个人，喝不完。」"},
  {t:"工牌还挂在脖子上，眼睛通红。",kw:"眼睛通红",ask:"今晚提交了三次代码，回回被打回。bug没修完，女朋友先没了。"}],
 resps:[
  {t:"「分手了还会难过，说明你认真爱过。酒少喝点，明天太阳照常升起。」",q:"best"},
  {t:"「要不要来根烤肠？难过的时候，吃点热的。」",q:"mid"},
  {t:"「嗨，旧的不去新的不来，下一个更乖！」",q:"bad"}],
 relief:"他愣了一下，忽然笑了：「你说得对……至少代码不会跟我说分手。」",
 storm:"他皱起眉，抓起啤酒转身就走：「你不懂。」",
 calm:"他点点头，抱着啤酒在窗边坐了很久，临走时说了声谢谢。",
 frag:"凌晨一点，有人把失恋和没修完的bug一起打包带走。这座城市的深夜，藏着很多没说完的「我们」。"},

{id:"c2",name:"晓雨",emoji:"👩",mood:66,
 intro:"她买了醒酒药和创可贴，围巾上有一点酒气。",
 clues:[
  {t:"购物篮里有醒酒药、创可贴，还有一瓶水。",kw:"创可贴",ask:"创可贴不是给她自己的——「那个傻子喝多了，总摔跤。」"},
  {t:"手机里存着打车软件，目的地：城西某小区。",kw:"城西某小区",ask:"那个地址，和刚才买啤酒的程序员手机里的定位，是同一个小区。"},
  {t:"她反复点开聊天框，输入了，又一个字一个字删掉。"}],
 resps:[
  {t:"「去找他吧。有些话，醒酒药是醒不了的。」",q:"best"},
  {t:"「先喝口水，跑过去也来得及。」",q:"mid"},
  {t:"「分都分了，还管他死活？」",q:"bad"}],
 relief:"她抓起袋子就往外跑：「谢谢你！他要是敢睡大街，我饶不了他！」",
 storm:"她攥紧袋子，低头快步离开：「……不用你管。」",
 calm:"她在门口站了一会儿，还是上了那辆出租车。",
 frag:"凌晨两点，有人把「分手吧」三个字，连同醒酒药一起，跑着送了回去。"},

{id:"c3",name:"广告人老周",emoji:"🧑‍💼",mood:64,
 intro:"他一口气拿了三罐咖啡、两个饭团，领带松垮地挂着。",
 clues:[
  {t:"笔记本摊开着，每一页都写着「推翻重来」。",kw:"推翻重来",ask:"这是今晚第三版方案。甲方说明早九点要，「就改几个字」。"},
  {t:"皮鞋上沾了灰，西装裤脚有点潮——他是跑着赶末班地铁的，没赶上。"},
  {t:"他看了眼手表，又看了眼咖啡，像在计算自己还能撑几轮。"}],
 resps:[
  {t:"「方案会过去的。先吃口热的，胃是你自己的。」",q:"best"},
  {t:"「咖啡第二件半价，要不再拿一罐？」",q:"mid"},
  {t:"「甲方虐我千百遍，习惯就好啦，哈哈。」",q:"bad"}],
 relief:"他撕开饭团狼吞虎咽：「你说得对。先活着，明天再死。」",
 storm:"他扯了扯嘴角：「站着说话不腰疼。」拎着咖啡走了。",
 calm:"他坐在窗边，一边吃一边改PPT，背影有点佝偻。",
 frag:"凌晨三点，有人用饭团续命。「就改几个字」，是成年人世界最大的谎言。"},

{id:"c4",name:"护士林晚",emoji:"👩‍⚕️",mood:60,
 intro:"白大褂里面是洗得发白的T恤，她要了一份关东煮。",
 clues:[
  {t:"她挑了萝卜和海带结，「好消化，夜里吃不胀。」"},
  {t:"手背上用圆珠笔写着：6床 2:00 换药。",kw:"6床",ask:"6床的老奶奶今晚情况不太好。她每隔一小时，就去看一眼。"},
  {t:"她捧着纸杯暖手，指节有点发白。"}],
 resps:[
  {t:"「你们守着病房，我们守着便利店——今晚，一起加油。」",q:"best"},
  {t:"「多给你盛点汤，暖暖手。」",q:"mid"},
  {t:"「上夜班真辛苦，工资一定很高吧？」",q:"bad"}],
 relief:"她眼睛弯起来：「第一次有人跟我说，一起加油。」",
 storm:"她抿了抿嘴，端着关东煮走了，没再说话。",
 calm:"她安静地吃完，把纸杯扔进垃圾桶，摆了摆手。",
 frag:"凌晨，有人把病房的灯，守成了便利店的灯。"},

{id:"c5",name:"陈伯",emoji:"👴",mood:55,
 intro:"穿中山装的老人，准时出现，拿了一瓶纯牛奶。",
 clues:[
  {t:"「睡不着，出来走走，怕吵着老伴。」"},
  {t:"他把牛奶捂在手里，等它不太凉了才喝。",kw:"老伴",ask:"老伴去年冬天走的。他说：「房子太大，一个人睡不踏实。」"},
  {t:"他总坐在靠窗的位置，看着街对面那盏路灯。"}],
 resps:[
  {t:"「牛奶趁热喝。陈伯，明晚还来，我给你留靠窗的位置。」",q:"best"},
  {t:"「办张会员卡吧，牛奶第二件半价。」",q:"mid"},
  {t:"「年纪大了就这样，早点睡吧。」",q:"bad"}],
 relief:"他摆摆手，笑得像个孩子：「中！明晚还来！」",
 storm:"他摇摇头，慢慢走出去，背影比来时更弯了些。",
 calm:"他喝完牛奶，把瓶子整齐地放在回收箱里。",
 frag:"有人用一瓶热牛奶，对抗一整栋楼的空。"},

{id:"c6",name:"少年阿杰",emoji:"🧑",mood:72,
 intro:"蹲在门口台阶上的少年，买了泡面和火腿肠。",
 clues:[
  {t:"手机只剩3%的电，他舍不得看。"},
  {t:"书包上别着一枚「三好学生」奖章。",kw:"三好学生",ask:"奖章是初中的。「上了高中，我就没拿过奖了。」今晚，和爸妈大吵了一架。"},
  {t:"他把泡面抱在怀里，像抱着什么宝贝。"}],
 resps:[
  {t:"「天亮就回去吧。你爸妈现在，肯定也没睡。」",q:"best"},
  {t:"「泡面我给你泡，开水免费。」",q:"mid"},
  {t:"「小小年纪离什么家？回去挨顿打就老实了。」",q:"bad"}],
 relief:"他低头扒着泡面，含糊地说：「……嗯，天亮就回。」",
 storm:"他猛地站起来，泡面差点打翻：「你们大人都一样！」",
 calm:"他吃完泡面，把汤都喝干净了，轻声说了句谢谢。",
 frag:"凌晨，有人用一碗泡面的时间，原谅了全世界，也包括自己。"},

{id:"c7",name:"代驾王师傅",emoji:"🧑‍✈️",mood:58,
 intro:"折叠电动车停在门口，他买了水和面包，在等单。",
 clues:[
  {t:"「今晚第三单还没来，前两单都是醉汉。」",kw:"第三单",ask:"「吐我一身，洗车费还得自己掏。这行，赚的是辛苦钱。」"},
  {t:"他把电动车推进了店门口的屋檐下，怕淋着。"},
  {t:"手机支架擦得很干净，屏幕上是接单页面。"}],
 resps:[
  {t:"「单会来的。王师傅，面包趁热吃，电先充上。」",q:"best"},
  {t:"「门口有插座，电动车放心充。」",q:"mid"},
  {t:"「代驾挺赚钱的吧？一单一两百呢。」",q:"bad"}],
 relief:"「借你吉言！」他啃着面包，手机突然响了——来单了。",
 storm:"他摆摆手：「你们坐办公室的，哪懂。」转身去看电动车了。",
 calm:"他喝完水，把空瓶扔进回收箱，继续盯着接单页面。",
 frag:"城市的夜晚，是由无数个「等单」的人撑起来的。"},

{id:"c8",name:"博士生苏晴",emoji:"👩‍🎓",mood:74,
 intro:"她抱着笔记本电脑，拿了黑巧克力和美式，眼睛里有血丝。",
 clues:[
  {t:"电脑屏保是一张实验数据图，曲线乱得像心电图。"},
  {t:"「第六次预实验，又失败了。」",kw:"预实验",ask:"导师说再做不出来，毕业就悬了。她已经两周没睡过一个整觉。"},
  {t:"她把巧克力掰成小块，一块一块数着吃，像在做什么仪式。"}],
 resps:[
  {t:"「爱迪生失败了上千次。你这才第六次，急什么。」",q:"best"},
  {t:"「这块巧克力我请了，算夜班姐妹的支援。」",q:"mid"},
  {t:"「读博这么苦，当初为啥想不开？」",q:"bad"}],
 relief:"她掰了一半巧克力递过来：「说得对。第七次，说不定就成了。」",
 storm:"她抱起电脑：「你说得轻松。」头也不回地走了。",
 calm:"她点点头，在窗边打开电脑，又开始敲键盘。",
 frag:"凌晨，有人把第六次失败嚼碎咽下去，准备迎接第七次。"},

{id:"c9",name:"中介阿强",emoji:"👨‍💼",mood:62,
 intro:"西装革履但头发乱了，他拿了便当和可乐，一屁股坐在窗边。",
 clues:[
  {t:"「带客户看到半夜，单子还是黄了。」"},
  {t:"领带被扯开，衬衫第二颗扣子系错了。",kw:"黄了",ask:"客户临门一脚嫌「风水不好」。「我查了三天资料，他一句话就否了。」"},
  {t:"他盯着便当加热的微波炉，像在等一个宣判。"}],
 resps:[
  {t:"「黄的单子会再来，凉的便当可不会。趁热吃。」",q:"best"},
  {t:"「可乐加冰吗？冰可乐治百病。」",q:"mid"},
  {t:"「卖房提成那么高，洒洒水啦。」",q:"bad"}],
 relief:"他大口扒饭：「你这话我爱听——单子会再来的！」",
 storm:"他冷笑一声：「你卖过房吗？」拎着便当走了。",
 calm:"他安静地吃完便当，把垃圾收拾得干干净净。",
 frag:"有人把「风水不好」四个字，就着便当一起消化了。"},

{id:"c10",name:"旅人老K",emoji:"🧳",mood:56,
 intro:"拖着行李箱的男人，航班延误五小时，第一次来杭州。",
 clues:[
  {t:"他买了数据线和饭团，充电宝已经彻底罢工。"},
  {t:"「本来约了朋友吃宵夜，结果人家等到两点先睡了。」",kw:"宵夜",ask:"「这座城市给我的第一面，有点狼狈啊。」他自嘲地笑了笑。"},
  {t:"他举着手机拍店门口的灯箱，「挺好看的，赛博朋克。」"}],
 resps:[
  {t:"「那我请你吃份关东煮——就当杭州先请你吃了顿宵夜。」",q:"best"},
  {t:"「店里有WiFi，密码是今天的日期。」",q:"mid"},
  {t:"「延误很正常，习惯就好。」",q:"bad"}],
 relief:"「哈哈，那我就不客气了！杭州，我记住你了！」",
 storm:"他耸耸肩：「行吧。」拖着箱子消失在夜色里。",
 calm:"他充上电，坐在窗边看这座陌生的城市。",
 frag:"有人在延误的航班里，意外收获了一座城市的善意。"},

{id:"c11",name:"环卫李大姐",emoji:"🧹",mood:52,

try{document.documentElement.lang=LANG==="zh"?"zh-CN":"en";document.title=t("appTitle");}catch(e){}

function newNight(){
  var pool=ALL.slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  S={guests:pool.slice(0,8),gi:0,warmth:0,storms:0,sleep:0,stam:80,coffee:0,shake:false,
     items:{gz:false,wl:false},frags:[],relieved:{},e1:false,e2:false,asked:false,
     timeMin:0,asleep:false,cur:null,money:1500};
}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function fmtT(m){var h=Math.floor(m/60),mm=m%60;return h+":"+(mm<10?"0":"")+mm;}
function moodTag(m){if(m<=10)return t("mood0");if(m<=35)return t("mood1");if(m<=60)return t("mood2");return t("mood3");}
function toast(msg){var d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(function(){d.remove();},2600);}

/* ---------- 顶栏 ---------- */

  +'<span class="chip">🕓 '+(S?fmtT(S.timeMin):"--")+adv+'</span>'
  +'<span class="chip">❤ <b>'+(S?S.warmth:0)+'</b></span>'
  +'<span class="chip">☕×'+(S?S.coffee:0)+'</span>'

  +(S&&S.items.wl?'<span class="chip">💡</span>':"")

  +'<span class="chip small abtn" style="padding:2px 10px;flex:0 1 auto" onclick="toggleLang()">'+(LANG==="zh"?"EN":"中文")+'</span>'
  +'</div><div class="trow" style="margin-top:6px">'

/* ---------- 开店准备：设备商店 ---------- */
function showShop(){newNight();renderShop();}
function renderShop(){VIEW="shop";
  $("app").innerHTML=topbar()
  +'<div class="card"><h2>'+t("shopTitle")+'</h2>'
  +'<p class="sub">'+t("shopSub",{n:1500})+'</p>'
  +'<div class="shopitem" id="shopGz"><div><b>'+t("itemGz")+'</b> <b style="color:#ffcf7d">'+t("price",{n:1200})+'</b><div class="desc">'+t("itemGzD")+'</div></div><button class="abtn small primary" id="buyGz" onclick="buyItem(\'gz\')">'+t("buy")+'</button></div>'
  +'<div class="shopitem" id="shopWl"><div><b>'+t("itemWl")+'</b> <b style="color:#ffcf7d">'+t("price",{n:800})+'</b><div class="desc">'+t("itemWlD")+'</div></div><button class="abtn small primary" id="buyWl" onclick="buyItem(\'wl\')">'+t("buy")+'</button></div>'
  +'<div class="btnrow"><button class="abtn primary" onclick="nextGuest()">'+t("openShop")+'</button></div></div>';
  refreshShop();
}
function refreshShop(){
  var m=S.money;
  var me=$("shopMoney");if(me)me.textContent=m;
  var gz=$("buyGz"),wl=$("buyWl");
  if(S.items.gz){gz.disabled=true;gz.textContent=t("bought");$("shopGz").classList.add("bought");}
  else if(m<1200){gz.disabled=true;gz.textContent=t("noMoney");}
  if(S.items.wl){wl.disabled=true;wl.textContent=t("bought");$("shopWl").classList.add("bought");}
  else if(m<800){wl.disabled=true;wl.textContent=t("noMoney");}
}
function buyItem(k){
  var cost=k=="gz"?1200:800;
  if(S.items[k]||S.money<cost){toast(t("toastNoBudget"),"bad");return;}
  S.money-=cost;
  S.items[k]=true;
  refreshShop();
  $("app").querySelector("#topbar").outerHTML=topbar();
  toast(k=="gz"?t("toastGz"):t("toastWl"));
}

/* ---------- 接待流程 ---------- */
function nextGuest(){
  clearInterval(shakeTimer);
  if(S.gi>=8){settle();return;}
  var g=S.guests[S.gi];
  unlockCodex(g.id);
  S.timeMin=S.gi*45;
  S.sleep+=8;
  if(S.sleep>=100){S.sleep=100;asleepFail();return;}
  var mood=g.mood+(S.items.gz?-6:0);
  var ord=[0,1,2];for(var i=2;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ord[i];ord[i]=ord[j];ord[j]=t;}
  S.cur={g:g,mood:mood,askedMap:{},order:ord};
  S.asked=false;
  renderGuest();
}
function renderGuest(){
  VIEW="guest";var c=S.cur,g=c.g,GE=G_(g)||g;
  var h=topbar()
  +'<div class="card"><div class="cust-head"><div class="avatar">'+g.emoji+'</div>'
  +'<div><div class="cust-name">'+esc(g.name)+'</div><div class="sub">'+esc(GE.intro)+'</div>'
  +'<span class="moodtag'+(c.mood<=10?" good":"")+'">'+moodTag(c.mood)+' · '+c.mood+'</span></div></div></div>'
  +(S.items.gz?'<div class="card" style="border-color:#4a3d22"><span class="sub">'+t("gzCard")+'</span></div>':"")
  +'<div class="card"><div class="steps">'
  +'<span class="step on">'+t("step1")+'</span><span class="step-arrow">→</span>'
  +'<span class="step'+(S.asked?" on":"")+'">'+t("step2")+'</span><span class="step-arrow">→</span>'
  +'<span class="step'+(S.asked?" on":"")+'">'+t("step3")+'</span></div>'
  +'<div class="sub">'+t("goalLine")+'</div></div>'
  +'<div class="card"><h2>'+t("observeT")+'</h2><div id="clues">'
  +GE.clues.map(function(cl,i){
    var asked=c.askedMap[i];
    var noStam=!asked&&!S.items.wl&&S.stam<8;
    return '<div class="clue">'+esc(cl.t)
    +(cl.kw?'<button class="kwbtn'+(asked?" done":"")+'" '+((asked||noStam)?"disabled":"")+' onclick="ask('+i+')">'
      +(asked?t("askedBtn"):(noStam?t("noStamBtn"):t("askBtn")+esc(cl.kw)))+'</button>':"")
    +(asked?'<span class="ask">'+esc(cl.ask)+'</span>':"")
    +'</div>';
  }).join("")
  +'</div><div class="sub">'+t("askTip")+(S.items.wl?t("askTipWl"):t("askTipStam"))+t("askDot")+(S.asked?t("askTipTail"):"")+'</div></div>'
  +'<div class="card"><h2>'+t("respT")+'</h2>'
  +(S.asked?'<div class="sub" style="color:#7fd6a4">'+t("respHintAsked")+'</div>'
    :'<div class="sub">'+t("respHint")+'</div>')
  +'<div id="respZone">'
  +c.order.map(function(oi){var r=GE.resps[oi];return '<button class="resp" onclick="respond('+oi+')">'+esc(r.t)+'</button>';}).join("")
  +'</div>'+(S.shake?'<div class="timer" id="shakeTimer">'+t("shakeT")+'</div>':"")
  +'</div>';
  $("app").innerHTML=h;
  if(S.shake)startShakeTimer();
}
function ask(i){
  var c=S.cur,cl=c.g.clues[i];
  if(c.askedMap[i])return;
  if(!S.items.wl){
    if(S.stam<8){toast(t("askNoStam"));return;}
    S.stam=Math.max(0,S.stam-8);S.sleep=Math.min(99,S.sleep+3);
  }
  c.askedMap[i]=1;S.asked=true;
  if(S.items.wl){c.mood=Math.max(0,c.mood-5);}
  renderGuest();
  toast(S.items.wl?t("askFree"):t("askCost"));
}

/* ---------- 回应 ---------- */
function startShakeTimer(){
  shakeLeft=10;
  clearInterval(shakeTimer);
  shakeTimer=setInterval(function(){
    shakeLeft--;
    var t=$("shakeTimer");
    if(t)t.textContent=t("shakeTN",{n:shakeLeft});
    if(shakeLeft<=0){clearInterval(shakeTimer);respond(-1);}
  },1000);
}
function respond(idx){
  clearInterval(shakeTimer);VIEW="rest";
  var c=S.cur,g=c.g,GE=G_(g)||g,r=idx<0?{t:t("timeoutResp"),q:"mid",timeout:true}:GE.resps[idx];
  var d=r.q=="best"?-50:(r.q=="mid"?-25:20);
  if(r.q=="best"&&S.asked)d-=10;
  if(r.timeout)d=-10;
  c.mood+=d;
  S.shake=false;
  var bestCost=false;
  if(r.q=="best"&&!r.timeout){S.stam=Math.max(0,S.stam-5);bestCost=true;}
  var outcome;
  if(r.q=="bad"&&c.mood>=85){S.storms++;outcome="storm";}
  else if(c.mood<=10){
    S.warmth++;S.relieved[g.id]=true;
    if(S.frags.indexOf(GE.frag)<0)S.frags.push(GE.frag);
    addFragTotal(GE.frag);
    checkEggs();
    outcome="relief";
  }else outcome="calm";
  S._rest={ri:idx,bestCost:bestCost,outcome:outcome,eggMsg:S._eggMsg||null};
  S._eggMsg=null;
  renderRest();
}
function renderRest(){
  var c=S.cur,g=c.g,GE=G_(g)||g,R=S._rest;
  var r=R.ri<0?{t:t("timeoutResp"),q:"mid",timeout:true}:GE.resps[R.ri];
  var h=topbar()
  +'<div class="card"><div class="cust-head"><div class="avatar">'+g.emoji+'</div>'
  +'<div><div class="cust-name">'+esc(g.name)+'</div><span class="moodtag'+(c.mood<=10?" good":"")+'">'+moodTag(c.mood)+' · '+c.mood+'</span></div></div>'
  +'<div class="dlg"><div class="who">'+t("youSaid")+'</div>'+esc(r.t)+'</div>'
  +(R.bestCost?'<div class="sub">'+t("bestCostT")+'</div>':"");
  if(R.outcome==="storm"){
    h+='<div class="dlg"><div class="who">'+esc(g.name)+'</div>'+esc(GE.storm)+'</div>'
    +'<div class="sub">'+t("stormSub",{n:S.storms})+'</div>';
  }else if(R.outcome==="relief"){
    h+='<div class="dlg" style="border-color:#3f5a3a"><div class="who">'+esc(g.name)+' · '+t("relievedT")+'</div>'+esc(GE.relief)+'</div>'
    +'<div class="frag">'+t("fragGet")+esc(GE.frag)+'</div>'
    +'<div class="sub">'+t("warmGet",{n:S.warmth})+'</div>';
    if(R.eggMsg){h+='<div class="frag" style="border-color:#8a6a2a">✨ '+esc(R.eggMsg)+'</div>';}
  }else{
    h+='<div class="dlg"><div class="who">'+esc(g.name)+'</div>'+esc(GE.calm)+'</div>'
    +'<div class="sub">'+t("calmSub")+'</div>';
  }
  h+='</div>'+interstitial();
  S._restH=h;$("app").innerHTML=h;
}
function checkEggs(){
  if(!S.e1&&S.relieved["c1"]&&S.relieved["c2"]){
    S.e1=true;S.warmth++;
    var f=t("egg1frag");
    S.frags.push(f);addFragTotal(f);
    S._eggMsg=t("egg1msg");
  }
  if(!S.e2&&S.relieved["c5"]&&S.relieved["c6"]){
    S.e2=true;
    var f2=t("egg2frag");
    S.frags.push(f2);addFragTotal(f2);
    S._eggMsg=t("egg2msg");
  }
}

function drinkCoffee(){
  var ceff=[40,25,10],cn=S.coffee;
  if(cn<3){S.sleep=Math.max(0,S.sleep-ceff[cn]);toast(t("toastCoffee",{n:ceff[cn]}));}
  else{S.shake=true;toast(t("toastShake"));}
  S.coffee++;
  $("app").querySelector("#topbar").outerHTML=topbar();
  var zone=$("app").querySelector(".card:last-child .btnrow");
  if(zone){var b=zone.querySelector("button");if(b){var n=S.coffee;
    b.textContent=n<3?t("coffeeN",{n:n+1,e:ceff[n]}):t("coffeeMax");}}
}

/* ---------- 整理货架小游戏 ---------- */
function shelfItems(){return [["🍙",t("sh_nm0")],["🍞",t("sh_nm1")],["🥛",t("sh_nm2")],["🍫",t("sh_nm3")],["🍜",t("sh_nm4")]];}
function openShelf(){
  var ov=document.createElement("div");ov.className="overlay";ov.id="shelfOv";
  var slots=shelfItems().map(function(it,i){
    return '<div class="shelf-slot" data-name="'+it[1]+'" style="left:'+(1+i*20.2)+'%">'+it[1]+'<br>'+t("shZone")+'</div>';
  }).join("");
  ov.innerHTML='<div class="sheet"><h2 class="center">'+t("shelfTitle")+'</h2>'
  +'<div class="sub center">'+t("shelfSub")+' <span class="timer" id="shelfTimer">20s</span></div>'
  +'<div id="shelfArea">'+slots+'</div>'
  +'<div class="btnrow"><button class="abtn" onclick="closeShelf(false)">'+t("giveUp")+'</button></div></div>';
  document.body.appendChild(ov);
  var area=$("shelfArea"),done=0,left=20;
  var timer=setInterval(function(){left--;var t=$("shelfTimer");if(t)t.textContent=left+"s";
    if(left<=0){clearInterval(timer);closeShelf(done>=5);}},1000);
  ov._timer=timer;ov._done=function(){return done;};
  shelfItems().forEach(function(it){
    var d=document.createElement("div");d.className="shelf-item";d.textContent=it[0];d.dataset.name=it[1];
    d.style.left=(5+Math.random()*75)+"%";d.style.top=(5+Math.random()*45)+"%";
    area.appendChild(d);
    var sx,sy,ox,oy,drag=false;
    d.addEventListener("pointerdown",function(e){drag=true;sx=e.clientX;sy=e.clientY;
      var r=d.getBoundingClientRect(),ar=area.getBoundingClientRect();
      ox=r.left-ar.left;oy=r.top-ar.top;d.setPointerCapture(e.pointerId);e.preventDefault();});
    d.addEventListener("pointermove",function(e){if(!drag)return;
      var ar=area.getBoundingClientRect();
      var nx=ox+e.clientX-sx,ny=oy+e.clientY-sy;
      nx=Math.max(0,Math.min(ar.width-56,nx));ny=Math.max(0,Math.min(ar.height-56,ny));
      d.style.left=nx+"px";d.style.top=ny+"px";});
    d.addEventListener("pointerup",function(e){if(!drag)return;drag=false;
      var dr=d.getBoundingClientRect();
      var ok=false;
      area.querySelectorAll(".shelf-slot").forEach(function(s){
        if(s.dataset.name!=d.dataset.name||s.dataset.full)return;
        var sr=s.getBoundingClientRect();
        var cx=dr.left+dr.width/2,cy=dr.top+dr.height/2;
        if(cx>sr.left&&cx<sr.right&&cy>sr.top&&cy<sr.bottom){ok=true;
          s.dataset.full="1";s.style.borderStyle="solid";s.style.borderColor="#3ecf8e";
          d.classList.add("locked");d.style.left=(sr.left-area.getBoundingClientRect().left+ (sr.width-56)/2)+"px";
          d.style.top=(sr.top-area.getBoundingClientRect().top+9)+"px";done++;}
      });
      if(done>=5){clearInterval(timer);setTimeout(function(){closeShelf(true);},350);}
    });
  });
}
function closeShelf(win){
  var ov=$("shelfOv");if(!ov)return;
  clearInterval(ov._timer);ov.remove();
  if(win){S.stam=Math.min(100,S.stam+15);toast(t("shelfWin"));}
  else{S.stam=Math.min(100,S.stam+5);toast(t("shelfQuit"));}
  $("app").querySelector("#topbar").outerHTML=topbar();
}

/* ---------- 结算 ---------- */
function asleepFail(){S.asleep=true;settle();}
function settle(){
  clearInterval(shakeTimer);VIEW="settle";
  var win=!S.asleep&&S.warmth>=3;
  var rating=S.warmth>=7?t("rate0"):S.warmth>=5?t("rate1"):S.warmth>=3?t("rate2"):t("rate3");
  var rateQ=S.warmth>=7?t("rateQ0"):S.warmth>=5?t("rateQ1"):S.warmth>=3?t("rateQ2"):(S.asleep?t("rateQ3a"):t("rateQ3b"));
  var wage=200+S.warmth*50+(S.storms==0&&!S.asleep?100:0);
  if(S.warmth>bestWarm){bestWarm=S.warmth;lsSet("best",bestWarm);}
  var newAch=[];
  function chk(id,name,cond){if(cond&&!ach[id]){unlockAch(id,name);newAch.push(name);}}
  chk("watcher",t("achWatch"),S.warmth>=5);
  chk("perfect",t("achPerfect"),S.storms==0&&!S.asleep);
  chk("dj",t("achDj"),fragsTotal.length>=10);
  var h=topbar()
  +'<div class="card center"><div class="bigemoji">'+(win?"🌅":"😴")+'</div>'
  +'<h1>'+(win?t("settleWinT"):t("settleLoseT"))+'</h1>'
  +'<p class="sub">'+(S.asleep?t("settleAsleepS"):(win?t("settleWinS"):t("settleLoseS")))+'</p></div>'
  +'<div class="card"><h2>'+t("settleStat")+'</h2><div class="stat-grid">'
  +'<div class="cell"><b>'+S.warmth+'</b>'+t("stWarm")+'</div>'
  +'<div class="cell"><b>'+S.storms+'</b>'+t("stStorm")+'</div>'
  +'<div class="cell"><b>'+S.frags.length+'</b>'+t("stFrag")+'</div>'
  +'<div class="cell"><b>'+t("price",{n:wage})+'</b>'+t("stWage")+'</div></div>'
  +'<div class="dlg"'+(win?' style="border-color:#3f5a3a"':'')+'><div class="who">'+(LANG==="zh"?"评级":"Rating")+'</div>'+(win?'🏮 ':'🌙 ')+'<b>'+rating+'</b> —— '+rateQ+'</div>'
  +(S._eggMsg?"": "")
  +'</div>'
  +(S.frags.length?'<div class="card"><h2>'+t("tonightFrag")+'</h2>'+S.frags.map(function(f){return '<div class="frag">'+esc(f)+'</div>';}).join("")+'</div>':"")
  +(newAch.length?'<div class="card"><h2>'+t("newAchT")+'</h2>'+newAch.map(function(a){return '<div class="sub">· '+esc(a)+'</div>';}).join("")+'</div>':"")
  +'<div class="card"><div class="btnrow"><button class="abtn primary" onclick="showShop()">'+t("againBtn")+'</button></div>'
  +'<div class="btnrow"><button class="abtn small" onclick="showCodex()">'+t("codexBtn")+'（'+codex.length+'/24）</button>'
  +'<button class="abtn small" onclick="showRadio()">'+t("radioBtn")+'（'+fragsTotal.length+'）</button>'
  +'<button class="abtn small" onclick="showStart()">'+t("homeBtn")+'</button></div></div>'
  +'<div class="foot">'+t("foot")+'</div>';
  $("app").innerHTML=h;
}

/* ---------- 图鉴 / 电台 ---------- */
function showCodex(){
  clearInterval(shakeTimer);VIEW="codex";
  var h=topbar()+'<div class="card"><h2>'+t("codexTitle")+' '+codex.length+'/24</h2><div class="codex-grid">'
  +ALL.map(function(g){var got=codex.indexOf(g.id)>=0;
    return '<div class="codex-cell'+(got?" got":" lock")+'"><span class="e">'+(got?g.emoji:"❔")+'</span>'+(got?esc(g.name):t("unknownT"))+'</div>';}).join("")
  +'</div><div class="btnrow"><button class="abtn" onclick="'+(S?"settle":"showStart")+'()">'+t("backBtn")+'</button></div></div>';
  $("app").innerHTML=h;
}
function showRadio(){
  clearInterval(shakeTimer);VIEW="radio";
  var h=topbar()+'<div class="card"><h2>'+t("radioTitle")+'</h2>'
  +'<p class="sub">'+(fragsTotal.length>=10?t("radioSub",{n:fragsTotal.length}):t("radioSub2",{n:fragsTotal.length}))+'</p>'
  +(fragsTotal.length?fragsTotal.map(function(f){return '<div class="frag">'+esc(f)+'</div>';}).join(""):'<div class="sub">'+t("radioEmpty")+'</div>')
  +'<div class="btnrow"><button class="abtn" onclick="'+(S?"settle":"showStart")+'()">'+t("backBtn")+'</button></div></div>';
  $("app").innerHTML=h;
}

/* ---------- 环境音 ---------- */
var AC=null,acGain=null,muted=false;
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();startHum();}catch(e){}}
function startHum(){
  var len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0),last=0;
  for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*2.6;}
  var src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  var f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=380;
  acGain=AC.createGain();acGain.gain.value=muted?0:0.045;
  src.connect(f);f.connect(acGain);acGain.connect(AC.destination);src.start();
}
function toggleMute(){muted=!muted;if(acGain)acGain.gain.value=muted?0:0.045;
  var t=$("app").querySelector("#topbar");if(t)t.outerHTML=topbar();}

/* ---------- 启动 ---------- */
showStart();
</script>
